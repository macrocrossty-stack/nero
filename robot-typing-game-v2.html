<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ロボットこうじょう">
<meta name="theme-color" content="#aee7ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="robot-icon-180.png">
<link rel="icon" type="image/png" href="robot-icon-180.png">
<title>ロボットこうじょう v2 - タイピングゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  :root {
    --bg-top: #aee7ff;
    --bg-bottom: #e8f9ff;
    --card: #ffffff;
    --ink: #234;
    --accent: #ff8c42;
  }

  html { height: 100%; overflow: hidden; overscroll-behavior: none; }

  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Yu Gothic', sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }

  /* ===== ヘッダー ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: max(10px, env(safe-area-inset-top)) 14px 6px;
    flex: 0 0 auto;
  }
  header h1 {
    font-size: clamp(15px, 2.6vw, 26px);
    color: #1a6fa8;
    text-shadow: 0 2px 0 #fff;
    white-space: nowrap;
  }
  .robot-count {
    background: var(--card);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: clamp(12px, 2vw, 18px);
    font-weight: bold;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    white-space: nowrap;
  }
  .robot-count span { color: var(--accent); font-size: 1.3em; }
  .hdr-btn {
    font-size: clamp(14px, 2.2vw, 22px);
    font-family: inherit;
    font-weight: bold;
    background: var(--card);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    color: #1a6fa8;
    white-space: nowrap;
  }

  /* ===== メイン ===== */
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    padding: 0 3vw;
    min-height: 0;
  }

  .target-card {
    background: var(--card);
    border-radius: 28px;
    padding: 1.5vh 3vw 2.5vh;
    text-align: center;
    box-shadow: 0 8px 0 rgba(26,111,168,0.15);
    min-width: 24vw;
  }
  .target-label {
    font-size: clamp(15px, 2.4vw, 24px);
    color: #557;
    margin-bottom: 0.5vh;
  }
  #targetChar {
    font-size: clamp(80px, 15vw, 190px);
    font-weight: bold;
    line-height: 1.1;
    color: var(--accent);
    animation: charPulse 1.2s ease-in-out infinite;
  }
  @keyframes charPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .progress-lights {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 1vh;
  }
  .light {
    width: clamp(13px, 2vw, 22px);
    height: clamp(13px, 2vw, 22px);
    border-radius: 50%;
    background: #dde5ec;
    transition: background 0.3s, transform 0.3s;
  }
  .light.on {
    background: #ffd23f;
    box-shadow: 0 0 10px #ffd23f;
    transform: scale(1.2);
  }

  .stage {
    position: relative;
    width: clamp(200px, 30vw, 400px);
    height: clamp(230px, 48vh, 460px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #robotSvg { width: 100%; height: 100%; overflow: visible; }

  .part { opacity: 0; }
  .part.shown {
    opacity: 1;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center;
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: translateY(-40px) scale(0.3); }
    70%  { opacity: 1; transform: translateY(5px) scale(1.1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .stage.dance #robotBody { animation: dance 0.5s ease-in-out 5; transform-origin: 50% 90%; }
  @keyframes dance {
    0%, 100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-6deg) translateY(-14px); }
    75% { transform: rotate(6deg) translateY(-14px); }
  }
  .stage.wobble #robotBody { animation: wobble 0.35s ease-in-out; transform-origin: 50% 90%; }
  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-3deg); }
    70% { transform: rotate(3deg); }
  }

  .antenna-light { animation: blinkLight 1s ease-in-out infinite; }
  @keyframes blinkLight {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .praise {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    font-size: clamp(26px, 5vw, 56px);
    font-weight: bold;
    color: #ff5d8f;
    text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,0.15);
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    white-space: nowrap;
    z-index: 3;
  }
  .praise.new-robot { color: #7c3aed; font-size: clamp(24px, 4.2vw, 46px); }
  .praise.new-building { color: #059669; font-size: clamp(22px, 4vw, 42px); top: 45%; }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  /* ===== キーボードヒント ===== */
  .kb {
    flex: 0 0 auto;
    padding: 1vh 2vw max(2vh, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .kb-row { display: flex; gap: 6px; }
  .key {
    width: clamp(24px, 4.2vw, 52px);
    height: clamp(24px, 4.2vw, 52px);
    background: var(--card);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px, 2vw, 24px);
    font-weight: bold;
    color: #789;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    cursor: pointer;
  }
  .key.target {
    background: #ffd23f;
    color: #a33;
    animation: keyGlow 0.8s ease-in-out infinite;
  }
  @keyframes keyGlow {
    0%, 100% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 0 rgba(255,210,63,0.8); transform: scale(1); }
    50% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 12px rgba(255,210,63,0); transform: scale(1.15); }
  }
  .key.pressed { background: #b8e986; transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }

  /* ===== スタート画面 ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #1b2a4a, #2c4a7c);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    z-index: 10;
    cursor: pointer;
  }
  #startScreen h2 {
    color: #fff;
    font-size: clamp(28px, 6vw, 64px);
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
  }
  #startScreen p {
    color: #ffd23f;
    font-size: clamp(16px, 3vw, 32px);
    text-align: center;
    padding: 0 4vw;
    animation: charPulse 1.2s ease-in-out infinite;
  }
  #startScreen .star {
    position: absolute;
    color: #fff;
    animation: blinkLight 2s ease-in-out infinite;
  }
  #startRobot { width: clamp(130px, 20vw, 250px); }

  /* ===== ロボットずかん ===== */
  #galleryOverlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 40, 70, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 4vh 4vw;
  }
  #galleryOverlay[hidden] { display: none; }
  .gallery-panel {
    background: var(--card);
    border-radius: 24px;
    width: min(900px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 0 rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .gallery-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: #eaf6ff;
  }
  .gallery-head h3 { font-size: clamp(18px, 3vw, 26px); color: #1a6fa8; }
  .close-btn {
    font-size: clamp(20px, 3vw, 28px);
    background: #ff5d8f;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 1.8em; height: 1.8em;
    cursor: pointer;
    line-height: 1;
    flex: 0 0 auto;
  }
  .gallery-grid {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(70px, 12vw, 110px), 1fr));
    gap: 8px;
    padding: 16px;
  }
  .gallery-grid svg { width: 100%; height: auto; }
  .gallery-empty {
    padding: 30px;
    text-align: center;
    font-size: clamp(15px, 2.5vw, 22px);
    color: #789;
  }

  /* ===== ロボットタウン ===== */
  #townOverlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #7ecbff 0%, #c9ecff 55%, #e8f9ff 100%);
  }
  #townOverlay[hidden] { display: none; }
  .town-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 16px 8px;
  }
  .town-head h3 {
    font-size: clamp(17px, 3vw, 28px);
    color: #14532d;
    text-shadow: 0 2px 0 #fff;
  }
  #townHint {
    background: rgba(255,255,255,0.85);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: clamp(12px, 2vw, 18px);
    font-weight: bold;
    color: #b45309;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #townScene {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
  }
  .town-sun {
    position: absolute;
    top: 4%; right: 6%;
    font-size: clamp(30px, 5vw, 56px);
  }
  .town-cloud {
    position: absolute;
    font-size: clamp(24px, 4vw, 44px);
    opacity: 0.9;
    animation: cloudDrift 40s linear infinite;
  }
  @keyframes cloudDrift {
    from { transform: translateX(-15vw); }
    to   { transform: translateX(115vw); }
  }
  .town-ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 84px;
    background: linear-gradient(180deg, #86d97c, #5cbf6b);
    border-top: 4px solid #4ca85b;
  }
  .town-road {
    position: absolute;
    left: 0; right: 0; bottom: 24px;
    height: 26px;
    background: #b8c4cc;
    border-top: 3px dashed #fff;
  }
  .building {
    position: absolute;
    bottom: 78px;
    animation: buildingPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes buildingPop {
    from { transform: translateY(30px) scale(0.3); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .building svg { display: block; }
  .b-label {
    text-align: center;
    font-size: clamp(10px, 1.6vw, 14px);
    font-weight: bold;
    color: #14532d;
    text-shadow: 0 1px 0 #fff;
  }
  .wheel-spin { animation: wheelSpin 14s linear infinite; transform-origin: 50px 42px; }
  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  .smoke { animation: smokeUp 3s ease-out infinite; opacity: 0; }
  .smoke.s2 { animation-delay: 1.5s; }
  @keyframes smokeUp {
    0% { opacity: 0.7; transform: translateY(0) scale(0.6); }
    100% { opacity: 0; transform: translateY(-26px) scale(1.4); }
  }

  .walker {
    position: absolute;
    bottom: 6px;
    left: 0;
    cursor: pointer;
    will-change: transform;
  }
  .walker svg {
    display: block;
    width: 100%;
    height: auto;
    animation: walkBob 0.5s ease-in-out infinite;
  }
  @keyframes walkBob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-4px) rotate(1.5deg); }
  }
  .walker.jump svg { animation: walkerJump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes walkerJump {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-38px) rotate(8deg); }
  }
  .town-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(15px, 2.5vw, 24px);
    font-weight: bold;
    color: #14532d;
    text-shadow: 0 2px 0 #fff;
    text-align: center;
    padding: 0 6vw;
  }

  .confetti {
    position: fixed;
    top: -20px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 5;
  }

  /* ===== iPadたて向き・せまい画面 ===== */
  @media (max-width: 820px), (orientation: portrait) {
    main { flex-direction: column; gap: 1vh; }
    .target-card { padding: 1vh 8vw 1.5vh; }
    #targetChar { font-size: clamp(64px, 18vw, 120px); }
    .stage { height: clamp(180px, 32vh, 320px); }
    header h1 { display: none; }
  }
</style>
</head>
<body>

<div id="startScreen">
  <h2>🤖 ロボットこうじょう</h2>
  <svg id="startRobot" viewBox="0 0 200 240"></svg>
  <p>がめんタッチか どれかのキーを おしてスタート!</p>
</div>

<header>
  <h1>🤖 ロボットこうじょう</h1>
  <div class="robot-count">つくった: <span id="count">0</span> たい</div>
  <button class="hdr-btn" id="townBtn">🏙 まち</button>
  <button class="hdr-btn" id="galleryBtn">📖 ずかん</button>
  <button class="hdr-btn" id="muteBtn" title="おとの ON/OFF">🔊</button>
</header>

<main>
  <div class="target-card">
    <div class="target-label" id="targetLabel">この キーを おしてね!</div>
    <div id="targetChar">A</div>
    <div class="progress-lights" id="lights"></div>
  </div>
  <div class="stage" id="stage">
    <svg id="robotSvg" viewBox="0 0 200 240"></svg>
  </div>
</main>

<div class="kb" id="kb"></div>

<div id="galleryOverlay" hidden>
  <div class="gallery-panel">
    <div class="gallery-head">
      <h3>📖 ロボットずかん (<span id="galleryCount">0</span> たい)</h3>
      <button class="close-btn" id="closeGallery">✕</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<div id="townOverlay" hidden>
  <div class="town-head">
    <h3>🏙 ロボットタウン (じんこう <span id="townPop">0</span> たい)</h3>
    <div id="townHint"></div>
    <button class="close-btn" id="closeTown">✕</button>
  </div>
  <div id="townScene"></div>
</div>

<script>
'use strict';

/* ================= 設定 ================= */
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
const PARTS_PER_ROBOT = 5;
const PRAISES = ['すごい!', 'やったね!', 'ピッタリ!', 'てんさい!', 'いいね!', 'その ちょうし!'];
const CHAR_NAMES = {
  A:'エー', B:'ビー', C:'シー', D:'ディー', E:'イー', F:'エフ', G:'ジー',
  H:'エイチ', I:'アイ', J:'ジェー', K:'ケー', L:'エル', M:'エム', N:'エヌ',
  O:'オー', P:'ピー', Q:'キュー', R:'アール', S:'エス', T:'ティー',
  U:'ユー', V:'ブイ', W:'ダブリュー', X:'エックス', Y:'ワイ', Z:'ゼット',
  0:'ゼロ', 1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご',
  6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'
};
const KB_ROWS = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];
const HUES = [0, 25, 50, 90, 140, 170, 200, 225, 260, 290, 320, 345];

/* ================= 状態 ================= */
let state = 'start';          // start | playing | celebrate
let target = null;
let partsDone = 0;
let currentSpec = null;
let robotCount = Number(localStorage.getItem('robotCount') || 0);
let collection = [];
try { collection = JSON.parse(localStorage.getItem('robotCollection2') || '[]'); } catch (e) {}
let muted = localStorage.getItem('robotMuted') === '1';

/* ================= サウンド ================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, start, dur, type, vol) {
  if (!audioCtx || muted) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  const t = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function soundPop()     { tone(520, 0, 0.12); tone(780, 0.08, 0.15); }
function soundWrong()   { tone(180, 0, 0.2, 'sine', 0.1); }
function soundBeep()    { tone(880 + Math.random() * 440, 0, 0.1, 'square', 0.12); tone(660, 0.1, 0.12, 'square', 0.1); }
function soundFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.15, 0.3, 'triangle', 0.2));
  [523, 659, 784, 1047].forEach((f, i) => tone(f * 2, i * 0.15 + 0.05, 0.25, 'sine', 0.08));
}

function say(text) {
  if (muted || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  u.pitch = 1.2;
  speechSynthesis.speak(u);
}

/* ================= ロボットの設計図 =================
   あたま5 × からだ5 × 目3 × くち3 × アンテナ3 × いろ12 = 8100 パターン */
function randomSpec() {
  return {
    h: HUES[Math.floor(Math.random() * HUES.length)],
    body: Math.floor(Math.random() * 5),
    head: Math.floor(Math.random() * 5),
    eye: Math.floor(Math.random() * 3),
    mouth: Math.floor(Math.random() * 3),
    ant: Math.floor(Math.random() * 3)
  };
}
function specKey(s) { return [s.h, s.body, s.head || 0, s.eye, s.mouth, s.ant].join('-'); }

function robotSvgMarkup(spec, withAll) {
  const body = `hsl(${spec.h}, 70%, 55%)`;
  const dark = `hsl(${spec.h}, 70%, 38%)`;
  const lite = `hsl(${(spec.h + 40) % 360}, 80%, 65%)`;
  const cls = withAll ? 'part shown' : 'part';
  const headType = spec.head || 0;

  /* --- からだ (5しゅるい) --- */
  let torso;
  let armL = 34, armR = 146;
  if (spec.body === 0) {
    torso = `<rect x="58" y="118" width="84" height="84" rx="16" fill="${body}"/>
             <rect x="74" y="136" width="52" height="34" rx="8" fill="${lite}"/>
             <circle cx="88" cy="184" r="7" fill="#ffd23f"/>
             <circle cx="112" cy="184" r="7" fill="#ff5d8f"/>`;
  } else if (spec.body === 1) {
    torso = `<circle cx="100" cy="162" r="45" fill="${body}"/>
             <circle cx="100" cy="152" r="20" fill="${lite}"/>
             <circle cx="86" cy="188" r="6" fill="#ffd23f"/>
             <circle cx="114" cy="188" r="6" fill="#ff5d8f"/>`;
    armL = 36; armR = 144;
  } else if (spec.body === 2) {
    torso = `<rect x="68" y="112" width="64" height="92" rx="12" fill="${body}"/>
             <rect x="80" y="126" width="40" height="26" rx="6" fill="${lite}"/>
             <circle cx="100" cy="170" r="6" fill="#ffd23f"/>
             <circle cx="100" cy="186" r="6" fill="#ff5d8f"/>`;
    armL = 46; armR = 134;
  } else if (spec.body === 3) {
    torso = `<path d="M62 204 L62 148 A38 38 0 0 1 138 148 L138 204 Z" fill="${body}"/>
             <rect x="78" y="150" width="44" height="26" rx="6" fill="${lite}"/>
             <rect x="70" y="182" width="60" height="6" rx="3" fill="${dark}"/>
             <circle cx="88" cy="196" r="6" fill="#ffd23f"/>

function buildKeyboard() {
  const kb = document.getElementById('kb');
  KB_ROWS.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    row.forEach(ch => {
      const k = document.createElement('div');
      k.className = 'key';
      k.dataset.key = ch;
      k.textContent = ch;
      k.addEventListener('pointerdown', () => handleInput(ch));
      div.appendChild(k);
    });
    kb.appendChild(div);
  });

  const box = document.getElementById('lights');
  box.innerHTML = '';

    d.className = 'light';
    box.appendChild(d);

let townAnim = null;
let walkers = [];

function townOpen() { return !document.getElementById('townOverlay').hidden; }

function nextUnlock(pop) {
  for (const b of BUILDINGS) if (pop < b.need) return b;
  return null;
}
function unlockedCount(pop) { return BUILDINGS.filter(b => pop <= 0 ? false : b.need <= pop).length; }

function showTown() {
  const scene = document.getElementById('townScene');
  scene.innerHTML = '';
  const pop = collection.length;
  document.getElementById('townPop').textContent = pop;

  const nxt = nextUnlock(pop);
  document.getElementById('townHint').textContent = nxt
    ? `あと ${nxt.need - pop} たいで ${nxt.name}が たつよ!`
    : 'まちは さいだいきゅう! 🎉';

  scene.insertAdjacentHTML('beforeend', '<div class="town-sun">☀️</div>');
  [[8, 12, 0], [40, 6, -14], [70, 16, -26]].forEach(([l, t, d]) => {
    scene.insertAdjacentHTML('beforeend',
      `<div class="town-cloud" style="left:${l}%;top:${t}%;animation-delay:${d}s">☁️</div>`);
  });
  scene.insertAdjacentHTML('beforeend', '<div class="town-ground"></div><div class="town-road"></div>');

  BUILDINGS.forEach((b, i) => {
    if (pop >= b.need) {
      const el = document.createElement('div');
      el.className = 'building';
      el.style.left = BUILDING_SLOTS[i] + '%';
      el.style.animationDelay = (i * 0.08) + 's';
      el.innerHTML = b.svg + `<div class="b-label">${b.name}</div>`;
      scene.appendChild(el);
    }
  });

  walkers = [];
  if (pop === 0) {
    scene.insertAdjacentHTML('beforeend',
      '<div class="town-empty">まだ だれも いないよ。<br>ロボットを つくって まちに よぼう!</div>');
  } else {
    const residents = collection.slice(-24);
    const sceneW = scene.clientWidth || window.innerWidth;
    residents.forEach((spec, i) => {
      const el = document.createElement('div');
      el.className = 'walker';
      const w = 48 + Math.random() * 30;
      el.style.width = w + 'px';
      el.style.bottom = (4 + Math.random() * 42) + 'px';
      el.style.zIndex = String(10 + Math.round(48 - (4 + Math.random() * 42)));
      el.appendChild(miniRobotSvg(spec));
      el.querySelector('svg').style.animationDelay = (Math.random() * 0.5) + 's';
      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        ensureAudio();
        soundBeep();
        el.classList.remove('jump');
        void el.offsetWidth;
        el.classList.add('jump');
      });
      scene.appendChild(el);
      walkers.push({
        el, w,
        x: Math.random() * Math.max(1, sceneW - w),
        dir: Math.random() > 0.5 ? 1 : -1,
        speed: 18 + Math.random() * 30,
        pauseUntil: 0,
        nextThink: performance.now() + 1000 + Math.random() * 3000
      });
    });
  }

  document.getElementById('townOverlay').hidden = false;
  let last = performance.now();
  const step = (now) => {
    if (!townOpen()) { townAnim = null; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const sceneW = scene.clientWidth || window.innerWidth;
    walkers.forEach(wk => {
      if (now >= wk.nextThink) {
        wk.nextThink = now + 1500 + Math.random() * 4000;
        if (Math.random() < 0.35) {
          wk.pauseUntil = now + 800 + Math.random() * 2000;
        } else {
          wk.dir = Math.random() > 0.5 ? 1 : -1;
          wk.speed = 18 + Math.random() * 30;
        }
      }
      if (now < wk.pauseUntil) {
        wk.el.style.transform = `translateX(${wk.x}px) scaleX(${wk.dir})`;
        return;
      }
      wk.x += wk.speed * dt * wk.dir;
      if (wk.x < 0) { wk.x = 0; wk.dir = 1; }
      if (wk.x > sceneW - wk.w) { wk.x = Math.max(0, sceneW - wk.w); wk.dir = -1; }
      wk.el.style.transform = `translateX(${wk.x}px) scaleX(${wk.dir})`;
    });
    townAnim = requestAnimationFrame(step);
  };
  if (townAnim) cancelAnimationFrame(townAnim);
  townAnim = requestAnimationFrame(step);
}

function hideTown() {
  document.getElementById('townOverlay').hidden = true;
  if (townAnim) { cancelAnimationFrame(townAnim); townAnim = null; }
  walkers = [];
}

/* ================= ゲーム進行 ================= */
function nextTarget() {
  let next;
  do { next = CHARS[Math.floor(Math.random() * CHARS.length)]; } while (next === target);
  target = next;
  document.getElementById('targetChar').textContent = target;
  document.querySelectorAll('.key').forEach(k => {
    k.classList.toggle('target', k.dataset.key === target);
  });
  say(CHAR_NAMES[target] || target);
}

function newRobot() {
  partsDone = 0;
  buildRobot();
  updateLights();
  document.getElementById('targetLabel').textContent = 'この キーを おしてね!';
  state = 'playing';
  nextTarget();
}

function flashKey(ch, cls) {
  const k = document.querySelector(`.key[data-key="${ch}"]`);
  if (!k) return;
  k.classList.add(cls);
  setTimeout(() => k.classList.remove(cls), 250);
}

function handleInput(ch) {
  ensureAudio();
  if (galleryOpen()) { hideGallery(); return; }
  if (townOpen()) return;
  if (state === 'start') { startGame(); return; }
  if (state !== 'playing') return;
  if (!CHARS.includes(ch)) return;

  if (ch === target) {
    flashKey(ch, 'pressed');
    const part = document.querySelector(`#robotSvg .part[data-part="${partsDone}"]`);
    if (part) part.classList.add('shown');
    partsDone++;
    updateLights();
    soundPop();
    showPraise();

    if (partsDone >= PARTS_PER_ROBOT) {
      completeRobot();
    } else {
      nextTarget();
    }
  } else {
    flashKey(ch, 'pressed');
    soundWrong();
    const stage = document.getElementById('stage');
    stage.classList.remove('wobble');
    void stage.offsetWidth;
    stage.classList.add('wobble');
  }
}

function completeRobot() {
  state = 'celebrate';
  robotCount++;
  localStorage.setItem('robotCount', String(robotCount));
  updateCount();

  const isNew = !collection.some(s => specKey(s) === specKey(currentSpec));
  const prevUnlocked = unlockedCount(collection.length);
  collection.push(currentSpec);
  if (collection.length > 500) collection = collection.slice(-500);
  localStorage.setItem('robotCollection2', JSON.stringify(collection));
  const gotBuilding = unlockedCount(collection.length) > prevUnlocked;

  document.getElementById('targetChar').textContent = '🎉';
  document.getElementById('targetLabel').textContent = 'ロボット かんせい!';
  document.querySelectorAll('.key').forEach(k => k.classList.remove('target'));

  const stage = document.getElementById('stage');
  stage.classList.add('dance');
  soundFanfare();
  confetti();
  if (gotBuilding) {
    showPraise('🏗 まちに あたらしい たてもの!', 'new-building');
    say('ロボット かんせい! まちに あたらしい たてものが できたよ!');
  } else if (isNew) {
    showPraise('✨あたらしい ロボット!✨', 'new-robot');
    say('あたらしい ロボット かんせい! すごい!');
  } else {
    say('ロボット かんせい! すごい!');
  }

  setTimeout(() => {
    stage.classList.remove('dance');
    newRobot();
  }, 3200);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  state = 'playing';
  newRobot();
}

/* ================= 入力イベント ================= */
document.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  ensureAudio();
  if (galleryOpen()) { e.preventDefault(); hideGallery(); return; }
  if (townOpen()) { e.preventDefault(); hideTown(); return; }
  if (state === 'start') { e.preventDefault(); startGame(); return; }
  const ch = e.key.length === 1 ? e.key.toUpperCase() : null;
  if (ch && CHARS.includes(ch)) {
    e.preventDefault();
    handleInput(ch);
  }
});

document.getElementById('startScreen').addEventListener('pointerdown', () => {
  ensureAudio();
  startGame();
});

document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  localStorage.setItem('robotMuted', muted ? '1' : '0');
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});

document.getElementById('galleryBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  hideTown();
  showGallery();
});
document.getElementById('closeGallery').addEventListener('click', hideGallery);
document.getElementById('galleryOverlay').addEventListener('pointerdown', (e) => {
  if (e.target.id === 'galleryOverlay') hideGallery();
});

document.getElementById('townBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  hideGallery();
  showTown();
});
document.getElementById('closeTown').addEventListener('click', hideTown);

/* iPadのピンチズーム・ダブルタップズームを止める */
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

/* ================= 初期化 ================= */
function addStars() {
  const screen = document.getElementById('startScreen');
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = Math.random() > 0.5 ? '✦' : '⭐';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.fontSize = 8 + Math.random() * 16 + 'px';
    s.style.animationDelay = Math.random() * 2 + 's';
    screen.appendChild(s);
  }
}

buildKeyboard();
buildLights();
updateCount();
document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
document.getElementById('startRobot').appendChild(
  miniRobotSvg({ h: 200, body: 0, head: 0, eye: 0, mouth: 0, ant: 0 }).firstElementChild || document.createElementNS('http://www.w3.org/2000/svg','g')
);
addStars();
</script>
</body>
