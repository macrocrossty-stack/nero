<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ロボットこうじょう">
<meta name="theme-color" content="#aee7ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="robot-icon-180.png">
<link rel="icon" type="image/png" href="robot-icon-180.png">
<title>ロボットこうじょう v2 - タイピングゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  :root {
    --bg-top: #aee7ff;
    --bg-bottom: #e8f9ff;
    --card: #ffffff;
    --ink: #234;
    --accent: #ff8c42;
  }

  html { height: 100%; overflow: hidden; overscroll-behavior: none; }

  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Yu Gothic', sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }

  /* ===== ヘッダー ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: max(10px, env(safe-area-inset-top)) 14px 6px;
    flex: 0 0 auto;
  }
  header h1 {
    font-size: clamp(15px, 2.6vw, 26px);
    color: #1a6fa8;
    text-shadow: 0 2px 0 #fff;
    white-space: nowrap;
  }
  .robot-count {
    background: var(--card);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: clamp(12px, 2vw, 18px);
    font-weight: bold;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    white-space: nowrap;
  }
  .robot-count span { color: var(--accent); font-size: 1.3em; }
  .hdr-btn {
    font-size: clamp(14px, 2.2vw, 22px);
    font-family: inherit;
    font-weight: bold;
    background: var(--card);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    color: #1a6fa8;
    white-space: nowrap;
  }

  /* ===== メイン ===== */
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    padding: 0 3vw;
    min-height: 0;
  }

  .target-card {
    background: var(--card);
    border-radius: 28px;
    padding: 1.5vh 3vw 2.5vh;
    text-align: center;
    box-shadow: 0 8px 0 rgba(26,111,168,0.15);
    min-width: 24vw;
  }
  .target-label {
    font-size: clamp(15px, 2.4vw, 24px);
    color: #557;
    margin-bottom: 0.5vh;
  }
  #targetChar {
    font-size: clamp(80px, 15vw, 190px);
    font-weight: bold;
    line-height: 1.1;
    color: var(--accent);
    animation: charPulse 1.2s ease-in-out infinite;
  }
  @keyframes charPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .progress-lights {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 1vh;
  }
  .light {
    width: clamp(13px, 2vw, 22px);
    height: clamp(13px, 2vw, 22px);
    border-radius: 50%;
    background: #dde5ec;
    transition: background 0.3s, transform 0.3s;
  }
  .light.on {
    background: #ffd23f;
    box-shadow: 0 0 10px #ffd23f;
    transform: scale(1.2);
  }

  .stage {
    position: relative;
    width: clamp(200px, 30vw, 400px);
    height: clamp(230px, 48vh, 460px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #robotSvg { width: 100%; height: 100%; overflow: visible; }

  .part { opacity: 0; }
  .part.shown {
    opacity: 1;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center;
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: translateY(-40px) scale(0.3); }
    70%  { opacity: 1; transform: translateY(5px) scale(1.1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .stage.dance #robotBody { animation: dance 0.5s ease-in-out 5; transform-origin: 50% 90%; }
  @keyframes dance {
    0%, 100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-6deg) translateY(-14px); }
    75% { transform: rotate(6deg) translateY(-14px); }
  }
  .stage.wobble #robotBody { animation: wobble 0.35s ease-in-out; transform-origin: 50% 90%; }
  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-3deg); }
    70% { transform: rotate(3deg); }
  }

  .antenna-light { animation: blinkLight 1s ease-in-out infinite; }
  @keyframes blinkLight {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .praise {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    font-size: clamp(26px, 5vw, 56px);
    font-weight: bold;
    color: #ff5d8f;
    text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,0.15);
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    white-space: nowrap;
    z-index: 3;
  }
  .praise.new-robot { color: #7c3aed; font-size: clamp(24px, 4.2vw, 46px); }
  .praise.new-building { color: #059669; font-size: clamp(22px, 4vw, 42px); top: 45%; }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  /* ===== キーボードヒント ===== */
  .kb {
    flex: 0 0 auto;
    padding: 1vh 2vw max(2vh, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .kb-row { display: flex; gap: 6px; }
  .key {
    width: clamp(24px, 4.2vw, 52px);
    height: clamp(24px, 4.2vw, 52px);
    background: var(--card);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px, 2vw, 24px);
    font-weight: bold;
    color: #789;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    cursor: pointer;
  }
  .key.target {
    background: #ffd23f;
    color: #a33;
    animation: keyGlow 0.8s ease-in-out infinite;
  }
  @keyframes keyGlow {
    0%, 100% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 0 rgba(255,210,63,0.8); transform: scale(1); }
    50% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 12px rgba(255,210,63,0); transform: scale(1.15); }
  }
  .key.pressed { background: #b8e986; transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }

  /* ===== スタート画面 ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #1b2a4a, #2c4a7c);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    z-index: 10;
    cursor: pointer;
  }
  #startScreen h2 {
    color: #fff;
    font-size: clamp(28px, 6vw, 64px);
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
  }
  #startScreen p {
    color: #ffd23f;
    font-size: clamp(16px, 3vw, 32px);
    text-align: center;
    padding: 0 4vw;
    animation: charPulse 1.2s ease-in-out infinite;
  }
  #startScreen .star {
    position: absolute;
    color: #fff;
    animation: blinkLight 2s ease-in-out infinite;
  }
  #startRobot { width: clamp(130px, 20vw, 250px); }

  /* ===== ロボットずかん ===== */
  #galleryOverlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 40, 70, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 4vh 4vw;
  }
  #galleryOverlay[hidden] { display: none; }
  .gallery-panel {
    background: var(--card);
    border-radius: 24px;
    width: min(900px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 0 rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .gallery-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: #eaf6ff;
  }
  .gallery-head h3 { font-size: clamp(18px, 3vw, 26px); color: #1a6fa8; }
  .close-btn {
    font-size: clamp(20px, 3vw, 28px);
    background: #ff5d8f;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 1.8em; height: 1.8em;
    cursor: pointer;
    line-height: 1;
    flex: 0 0 auto;
  }
  .gallery-grid {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(70px, 12vw, 110px), 1fr));
    gap: 8px;
    padding: 16px;
  }
  .gallery-grid svg { width: 100%; height: auto; }
  .gallery-empty {
    padding: 30px;
    text-align: center;
    font-size: clamp(15px, 2.5vw, 22px);
    color: #789;
  }
  .g-cell { position: relative; border-radius: 12px; cursor: pointer; }
  .g-cell.sel {
    outline: 4px solid #ffd23f;
    background: #fff7dd;
    animation: charPulse 0.8s ease-in-out infinite;
  }
  .fuse-hint {
    padding: 0 20px 10px;
    font-weight: bold;
    color: #b45309;
    font-size: clamp(13px, 2.2vw, 18px);
  }

  /* ===== がったい ===== */
  #fusionOverlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: radial-gradient(circle at 50% 38%, #2c4a7c, #101b33 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5vh;
    padding-bottom: 24vh;
  }
  #fusionOverlay[hidden] { display: none; }
  .fusion-label {
    color: #ffd23f;
    font-size: clamp(18px, 3.5vw, 34px);
    font-weight: bold;
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
    text-align: center;
  }
  .fusion-stage {
    position: relative;
    width: min(92vw, 720px);
    height: 34vh;
  }
  .f-bot {
    position: absolute;
    top: 50%;
    width: clamp(80px, 16vw, 160px);
    transform: translateY(-50%);
    transition: left 0.8s cubic-bezier(0.5, -0.2, 0.5, 1.2),
                transform 0.8s cubic-bezier(0.5, -0.2, 0.5, 1.2),
                opacity 0.4s;
  }
  .f-bot svg { width: 100%; height: auto; filter: drop-shadow(0 0 10px rgba(174,231,255,0.35)); }
  .f-bot.charge svg { filter: drop-shadow(0 0 22px #ffd23f); }
  .f-result {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -52%) scale(0);
    width: clamp(150px, 28vw, 280px);
  }
  .f-result svg { width: 100%; height: auto; filter: drop-shadow(0 0 24px rgba(255,210,63,0.6)); }
  .f-result.shown { animation: fusePop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  @keyframes fusePop {
    to { transform: translate(-50%, -52%) scale(1); }
  }
  .fusion-code { display: flex; gap: 10px; }
  .f-ch {
    width: clamp(38px, 7vw, 64px);
    height: clamp(46px, 8vw, 76px);
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-weight: bold;
    font-size: clamp(24px, 5vw, 44px);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid rgba(255,255,255,0.25);
  }
  .f-ch.done { background: #2e9e5b; border-color: #7fd97c; }
  .f-ch.cur { border-color: #ffd23f; animation: charPulse 0.8s ease-in-out infinite; }
  .fusion-flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 35;
  }
  .fusion-flash.go { animation: flashAnim 0.6s ease-out; }
  @keyframes flashAnim {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }
  .kb { position: relative; z-index: 40; }

  /* ===== ロボットタウン ===== */
  #townOverlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #7ecbff 0%, #c9ecff 55%, #e8f9ff 100%);
  }
  #townOverlay[hidden] { display: none; }
  .town-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 16px 8px;
  }
  .town-head h3 {
    font-size: clamp(17px, 3vw, 28px);
    color: #14532d;
    text-shadow: 0 2px 0 #fff;
  }
  #townHint {
    background: rgba(255,255,255,0.85);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: clamp(12px, 2vw, 18px);
    font-weight: bold;
    color: #b45309;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #townScene {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
  }
  .town-sun {
    position: absolute;
    top: 4%; right: 6%;
    font-size: clamp(30px, 5vw, 56px);
  }
  .town-cloud {
    position: absolute;
    font-size: clamp(24px, 4vw, 44px);
    opacity: 0.9;
    animation: cloudDrift 40s linear infinite;
  }
  @keyframes cloudDrift {
    from { transform: translateX(-15vw); }
    to   { transform: translateX(115vw); }
  }
  #townSvg {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: block;
  }
  .smoke { animation: smokeUp 3s ease-out infinite; opacity: 0; }
  .smoke.s2 { animation-delay: 1.5s; }
  @keyframes smokeUp {
    0% { opacity: 0.7; transform: translateY(0) scale(0.6); }
    100% { opacity: 0; transform: translateY(-26px) scale(1.4); }
  }

  .iso-robot { cursor: pointer; will-change: transform; }
  .iso-bob { animation: walkBob 0.55s ease-in-out infinite; }
  @keyframes walkBob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-3px) rotate(1.5deg); }
  }
  .iso-robot.jump .iso-bob { animation: walkerJump 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes walkerJump {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-30px) rotate(8deg); }
  }
  .town-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(15px, 2.5vw, 24px);
    font-weight: bold;
    color: #14532d;
    text-shadow: 0 2px 0 #fff;
    text-align: center;
    padding: 0 6vw;
  }

  .confetti {
    position: fixed;
    top: -20px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 5;
  }

  /* ===== iPadたて向き・せまい画面 ===== */
  @media (max-width: 820px), (orientation: portrait) {
    main { flex-direction: column; gap: 1vh; }
    .target-card { padding: 1vh 8vw 1.5vh; }
    #targetChar { font-size: clamp(64px, 18vw, 120px); }
    .stage { height: clamp(180px, 32vh, 320px); }
    header h1 { display: none; }
  }
</style>
</head>
<body>

<div id="startScreen">
  <h2>🤖 ロボットこうじょう</h2>
  <svg id="startRobot" viewBox="0 0 200 240"></svg>
  <p>がめんタッチか どれかのキーを おしてスタート!</p>
</div>

<header>
  <h1>🤖 ロボットこうじょう</h1>
  <div class="robot-count">つくった: <span id="count">0</span> たい</div>
  <button class="hdr-btn" id="townBtn">🏙 まち</button>
  <button class="hdr-btn" id="galleryBtn">📖 ずかん</button>
  <button class="hdr-btn" id="muteBtn" title="おとの ON/OFF">🔊</button>
</header>

<main>
  <div class="target-card">
    <div class="target-label" id="targetLabel">この キーを おしてね!</div>
    <div id="targetChar">A</div>
    <div class="progress-lights" id="lights"></div>
  </div>
  <div class="stage" id="stage">
    <svg id="robotSvg" viewBox="0 0 200 240"></svg>
  </div>
</main>

<div class="kb" id="kb"></div>

<div id="galleryOverlay" hidden>
  <div class="gallery-panel">
    <div class="gallery-head">
      <h3>📖 ロボットずかん (<span id="galleryCount">0</span> たい)</h3>
      <button class="hdr-btn" id="fuseBtn">⚡がったい</button>
      <button class="hdr-btn" id="superFuseBtn" hidden>🌟ちょうがったい</button>
      <button class="close-btn" id="closeGallery">✕</button>
    </div>
    <div class="fuse-hint" id="fuseHint" hidden></div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<div id="fusionOverlay" hidden>
  <div class="fusion-label" id="fusionLabel"></div>
  <div class="fusion-stage" id="fusionStage"></div>
  <div class="fusion-code" id="fusionCode"></div>
</div>
<div class="fusion-flash" id="fusionFlash"></div>

<div id="townOverlay" hidden>
  <div class="town-head">
    <h3>🏙 ロボットタウン (じんこう <span id="townPop">0</span> たい)</h3>
    <div id="townHint"></div>
    <button class="close-btn" id="closeTown">✕</button>
  </div>
  <div id="townScene"></div>
</div>

<script>
'use strict';

/* ================= 設定 ================= */
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
const PARTS_PER_ROBOT = 5;
const PRAISES = ['すごい!', 'やったね!', 'ピッタリ!', 'てんさい!', 'いいね!', 'その ちょうし!'];
const CHAR_NAMES = {
  A:'エー', B:'ビー', C:'シー', D:'ディー', E:'イー', F:'エフ', G:'ジー',
  H:'エイチ', I:'アイ', J:'ジェー', K:'ケー', L:'エル', M:'エム', N:'エヌ',
  O:'オー', P:'ピー', Q:'キュー', R:'アール', S:'エス', T:'ティー',
  U:'ユー', V:'ブイ', W:'ダブリュー', X:'エックス', Y:'ワイ', Z:'ゼット',
  0:'ゼロ', 1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご',
  6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'
};
const KB_ROWS = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];
const HUES = [0, 25, 50, 90, 140, 170, 200, 225, 260, 290, 320, 345];

/* ================= 状態 ================= */
let state = 'start';          // start | playing | celebrate
let target = null;
let partsDone = 0;
let currentSpec = null;
let robotCount = Number(localStorage.getItem('robotCount') || 0);
let collection = [];
try { collection = JSON.parse(localStorage.getItem('robotCollection2') || '[]'); } catch (e) {}
let muted = localStorage.getItem('robotMuted') === '1';

/* ================= サウンド ================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  // タッチ/キー操作のたびに、固まった読み上げエンジンを起こす
  if ('speechSynthesis' in window) {
    try { if (speechSynthesis.paused) speechSynthesis.resume(); } catch (e) {}
  }
}
function tone(freq, start, dur, type, vol) {
  if (!audioCtx || muted) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  const t = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function soundPop()     { tone(520, 0, 0.12); tone(780, 0.08, 0.15); }
function soundWrong()   { tone(180, 0, 0.2, 'sine', 0.1); }
function soundBeep()    { tone(880 + Math.random() * 440, 0, 0.1, 'square', 0.12); tone(660, 0.1, 0.12, 'square', 0.1); }
function soundFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.15, 0.3, 'triangle', 0.2));

/* --- 読み上げ (iPad/Safariの詰まり対策込み) --- */
let voiceJa = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voiceJa = vs.find(v => v.lang && v.lang.replace('_', '-').startsWith('ja')) || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let sayTimer = null;
function say(text) {
  if (muted || !('speechSynthesis' in window)) return;
  const synth = speechSynthesis;
  // iOSはcancel直後のspeakでキューが詰まることがあるため、少し待ってから話す
  try { synth.cancel(); } catch (e) {}
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => {
    try {
      if (synth.paused) synth.resume();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      if (voiceJa) u.voice = voiceJa;
      u.rate = 0.9;
      u.pitch = 1.2;
      say._current = u;  // 発話中のGCで無音になるiOSバグへの対策
      synth.speak(u);
    } catch (e) {}
  }, 80);
}

/* 画面復帰時にpausedのまま固まる対策 */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && 'speechSynthesis' in window) {
    try { if (speechSynthesis.paused) speechSynthesis.resume(); } catch (e) {}
  }
});

/* ================= ロボットの設計図 =================
   あたま5 × からだ5 × 目3 × くち3 × アンテナ3 × いろ12 = 8100 パターン */
function randomSpec() {
  return {
    h: HUES[Math.floor(Math.random() * HUES.length)],
    body: Math.floor(Math.random() * 5),
    head: Math.floor(Math.random() * 5),
    eye: Math.floor(Math.random() * 3),
    mouth: Math.floor(Math.random() * 3),
    ant: Math.floor(Math.random() * 3)
  };
}
function specKey(s) { return [s.h, s.h2 !== undefined ? s.h2 : '', s.body, s.head || 0, s.eye, s.mouth, s.ant, s.fusion || 0].join('-'); }

function robotSvgMarkup(spec, withAll) {
  const h2v = spec.h2 !== undefined ? spec.h2 : spec.h;   // がったいロボは2色め
  const body = `hsl(${spec.h}, 70%, 55%)`;
  const dark = `hsl(${spec.h}, 70%, 38%)`;
  const lite = `hsl(${(spec.h + 40) % 360}, 80%, 65%)`;
  const body2 = `hsl(${h2v}, 70%, 55%)`;
  const dark2 = `hsl(${h2v}, 70%, 38%)`;
  const lite2 = `hsl(${(h2v + 40) % 360}, 80%, 65%)`;
  const cls = withAll ? 'part shown' : 'part';
  const headType = spec.head || 0;

  /* --- からだ (5しゅるい) --- */
  let torso;
  let armL = 34, armR = 146;
  if (spec.body === 0) {
    torso = `<rect x="58" y="118" width="84" height="84" rx="16" fill="${body2}"/>
             <rect x="74" y="136" width="52" height="34" rx="8" fill="${lite2}"/>
             <circle cx="88" cy="184" r="7" fill="#ffd23f"/>
             <circle cx="112" cy="184" r="7" fill="#ff5d8f"/>`;
  } else if (spec.body === 1) {
    torso = `<circle cx="100" cy="162" r="45" fill="${body2}"/>
             <circle cx="100" cy="152" r="20" fill="${lite2}"/>
             <circle cx="86" cy="188" r="6" fill="#ffd23f"/>
             <circle cx="114" cy="188" r="6" fill="#ff5d8f"/>`;
    armL = 36; armR = 144;
  } else if (spec.body === 2) {
    torso = `<rect x="68" y="112" width="64" height="92" rx="12" fill="${body2}"/>
             <rect x="80" y="126" width="40" height="26" rx="6" fill="${lite2}"/>
             <circle cx="100" cy="170" r="6" fill="#ffd23f"/>
             <circle cx="100" cy="186" r="6" fill="#ff5d8f"/>`;
    armL = 46; armR = 134;
  } else if (spec.body === 3) {
    torso = `<path d="M62 204 L62 148 A38 38 0 0 1 138 148 L138 204 Z" fill="${body2}"/>
             <rect x="78" y="150" width="44" height="26" rx="6" fill="${lite2}"/>
             <rect x="70" y="182" width="60" height="6" rx="3" fill="${dark2}"/>
             <circle cx="88" cy="196" r="6" fill="#ffd23f"/>
             <circle cx="112" cy="196" r="6" fill="#ff5d8f"/>`;
    armL = 38; armR = 142;
  } else {
    torso = `<path d="M72 118 L128 118 L144 204 L56 204 Z" fill="${body2}"/>
             <rect x="82" y="132" width="36" height="26" rx="6" fill="${lite2}"/>
             <circle cx="88" cy="184" r="6" fill="#ffd23f"/>
             <circle cx="112" cy="184" r="6" fill="#ff5d8f"/>`;
    armL = 46; armR = 134;
  }

  /* --- あたま (5しゅるい) --- */
  let headShape;
  let eyeT = '', mouthT = '', antDy = 0, ownEyes = false;
  if (headType === 0) {
    headShape = `<rect x="60" y="28" width="80" height="66" rx="18" fill="${body}"/>`;
  } else if (headType === 1) {
    headShape = `<path d="M55 94 A45 45 0 0 1 145 94 Z" fill="${body}"/>
                 <path d="M55 94 A45 45 0 0 1 66 65 L134 65 A45 45 0 0 1 145 94 Z" fill="${body}"/>
                 <rect x="58" y="88" width="84" height="6" rx="3" fill="${dark}"/>`;
    eyeT = 'translate(0,12)'; mouthT = 'translate(0,8)'; antDy = 21;
  } else if (headType === 2) {
    headShape = `<rect x="62" y="42" width="76" height="52" rx="12" fill="${body}"/>`;
    const lensColors = ['#9ef', '#ffd23f', '#fff'];
    headShape += `<circle cx="82" cy="60" r="14" fill="${dark}"/>
                  <circle cx="118" cy="60" r="14" fill="${dark}"/>
                  <circle cx="82" cy="60" r="8" fill="${lensColors[spec.eye]}"/>
                  <circle cx="118" cy="60" r="8" fill="${lensColors[spec.eye]}"/>
                  <circle cx="85" cy="57" r="2.5" fill="#fff"/>
                  <circle cx="121" cy="57" r="2.5" fill="#fff"/>`;
    ownEyes = true; mouthT = 'translate(0,10)'; antDy = 14;
  } else if (headType === 3) {
    headShape = `<rect x="66" y="26" width="68" height="68" rx="10" fill="${body}"/>
                 <ellipse cx="100" cy="27" rx="34" ry="8" fill="${lite}"/>`;
    eyeT = 'translate(0,2)'; mouthT = 'translate(0,2)'; antDy = -10;
  } else {
    headShape = `<ellipse cx="100" cy="76" rx="50" ry="20" fill="${body}"/>
                 <circle cx="100" cy="56" r="18" fill="${lite}"/>
                 <ellipse cx="100" cy="76" rx="50" ry="20" fill="none" stroke="${dark}" stroke-width="3"/>`;
    eyeT = 'translate(44.9,25.4) scale(0.55)'; mouthT = 'translate(0,8)'; antDy = 10;
  }

  /* --- 目 (3しゅるい) --- */
  let eyes = '';
  if (!ownEyes) {
    if (spec.eye === 0) {
      eyes = `<circle cx="82" cy="52" r="9" fill="#fff"/><circle cx="118" cy="52" r="9" fill="#fff"/>
              <circle cx="84" cy="54" r="4.5" fill="#234"/><circle cx="116" cy="54" r="4.5" fill="#234"/>`;
    } else if (spec.eye === 1) {
      eyes = `<rect x="72" y="45" width="18" height="14" rx="4" fill="#9ef"/><rect x="110" y="45" width="18" height="14" rx="4" fill="#9ef"/>`;
    } else {
      eyes = `<circle cx="82" cy="52" r="8" fill="#ffd23f"/><circle cx="118" cy="52" r="8" fill="#ffd23f"/>
              <circle cx="82" cy="52" r="3" fill="#234"/><circle cx="118" cy="52" r="3" fill="#234"/>`;
    }
    eyes = `<g transform="${eyeT}">${eyes}</g>`;
  }

  /* --- くち (3しゅるい) --- */
  let mouth;
  if (spec.mouth === 0) {
    mouth = `<rect x="82" y="72" width="36" height="10" rx="5" fill="#234"/>
             <rect x="86" y="74" width="6" height="6" fill="${lite}"/>
             <rect x="96" y="74" width="6" height="6" fill="${lite}"/>
             <rect x="106" y="74" width="6" height="6" fill="${lite}"/>`;
  } else if (spec.mouth === 1) {
    mouth = `<path d="M84 72 Q100 86 116 72" stroke="#234" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  } else {
    mouth = `<rect x="84" y="70" width="32" height="3.5" rx="1.5" fill="#234"/>
             <rect x="84" y="76" width="32" height="3.5" rx="1.5" fill="#234"/>
             <rect x="84" y="82" width="32" height="3.5" rx="1.5" fill="#234"/>`;
  }
  mouth = `<g transform="${mouthT}">${mouth}</g>`;

  /* --- アンテナ (3しゅるい) --- */
  let antenna;
  if (spec.ant === 0) {
    antenna = `<rect x="97" y="8" width="6" height="22" fill="${dark}"/>
               <circle class="antenna-light" cx="100" cy="8" r="8" fill="#ff5d8f"/>`;
  } else if (spec.ant === 1) {
    antenna = `<rect x="74" y="12" width="5" height="18" fill="${dark}"/>
               <rect x="121" y="12" width="5" height="18" fill="${dark}"/>
               <circle class="antenna-light" cx="76" cy="12" r="6" fill="#ff5d8f"/>
               <circle class="antenna-light" cx="123" cy="12" r="6" fill="#ffd23f"/>`;
  } else {
    antenna = `<rect x="97" y="14" width="6" height="16" fill="${dark}"/>
               <path d="M82 16 Q100 -4 118 16 Z" fill="${lite}"/>
               <circle class="antenna-light" cx="100" cy="10" r="4" fill="#ff5d8f"/>`;
  }
  antenna = `<g transform="translate(0,${antDy})">${antenna}</g>`;

  /* --- がったいロボの装飾 --- */
  let wings = '', fusionExtras = '';
  if (spec.fusion) {
    wings = `<g class="${cls}">
      <polygon points="60,130 8,78 22,148 58,156" fill="#ffd23f" stroke="#e8a800" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="140,130 192,78 178,148 142,156" fill="#ffd23f" stroke="#e8a800" stroke-width="3" stroke-linejoin="round"/></g>`;
    const star = (cx, cy, r) => {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * 0.45 : r;
        const a = -Math.PI / 2 + i * Math.PI / 5;
        pts.push(`${(cx + Math.cos(a) * rr).toFixed(1)},${(cy + Math.sin(a) * rr).toFixed(1)}`);
      }
      return `<polygon points="${pts.join(' ')}" fill="#ffd23f" stroke="#e8a800" stroke-width="2.5" stroke-linejoin="round"/>`;
    };
    fusionExtras = `<g class="${cls}">` + star(100, 152, spec.fusion === 2 ? 18 : 13);
    if (spec.fusion === 2) {
      fusionExtras += `
      <rect x="26" y="112" width="34" height="20" rx="7" fill="${dark}"/>
      <rect x="140" y="112" width="34" height="20" rx="7" fill="${dark}"/>
      <polygon points="100,42 74,8 92,34" fill="#ffd23f" stroke="#e8a800" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="100,42 126,8 108,34" fill="#ffd23f" stroke="#e8a800" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
    fusionExtras += '</g>';
  }

  return `
  <g id="robotBody">
    <g class="${cls}" data-part="0">
      <rect x="72" y="196" width="20" height="30" rx="6" fill="${dark2}"/>
      <rect x="108" y="196" width="20" height="30" rx="6" fill="${dark2}"/>
      <rect x="62" y="222" width="36" height="14" rx="7" fill="${body2}"/>
      <rect x="102" y="222" width="36" height="14" rx="7" fill="${body2}"/>
    </g>
    ${wings}
    <g class="${cls}" data-part="1">${torso}</g>
    <g class="${cls}" data-part="2">
      <rect x="${armL}" y="126" width="20" height="52" rx="10" fill="${dark}"/>
      <rect x="${armR}" y="126" width="20" height="52" rx="10" fill="${dark}"/>
      <circle cx="${armL + 10}" cy="184" r="12" fill="${lite}"/>
      <circle cx="${armR + 10}" cy="184" r="12" fill="${lite}"/>
    </g>
    <g class="${cls}" data-part="3">
      <rect x="88" y="90" width="24" height="30" fill="${dark}"/>
      ${headShape}
      ${eyes}
      ${mouth}
    </g>
    <g class="${cls}" data-part="4">${antenna}</g>
    ${fusionExtras}
  </g>`;
}

function miniRobotSvg(spec) {
  const holder = document.createElement('div');
  holder.innerHTML = `<svg viewBox="0 0 200 240">${robotSvgMarkup(spec, true)}</svg>`;
  const g = holder.querySelector('#robotBody');
  if (g) g.removeAttribute('id');
  return holder.firstElementChild;
}

/* ================= ロボットタウン (クオータービュー) ================= */
const ISO = 40;                                     // 1ユニットあたりのピクセル
const TILES_MAX = 49;                               // 7x7 うずまき
function tileCountFor(pop) { return pop <= 0 ? 0 : Math.min(TILES_MAX, 1 + Math.floor(pop / 3)); }

function isoP(u, v, z) { return [(u - v) * ISO, (u + v) * ISO * 0.5 - z * ISO]; }
function pg(pts, fill, cls) {
  return `<polygon points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="${fill}"${cls ? ` class="${cls}"` : ''}/>`;
}
function shades(h, s, l) {
  return {
    top: `hsl(${h},${s}%,${Math.min(94, l + 12)}%)`,
    left: `hsl(${h},${s}%,${l}%)`,
    right: `hsl(${h},${s}%,${Math.max(8, l - 14)}%)`
  };
}
function box(u, v, z0, w, d, h, c) {
  return pg([isoP(u,v,z0+h), isoP(u+w,v,z0+h), isoP(u+w,v+d,z0+h), isoP(u,v+d,z0+h)], c.top)
       + pg([isoP(u,v+d,z0+h), isoP(u+w,v+d,z0+h), isoP(u+w,v+d,z0), isoP(u,v+d,z0)], c.left)
       + pg([isoP(u+w,v,z0+h), isoP(u+w,v+d,z0+h), isoP(u+w,v+d,z0), isoP(u+w,v,z0)], c.right);
}
function roofP(u, v, z0, w, d, h, c) {
  const R1 = isoP(u, v + d/2, z0 + h), R2 = isoP(u + w, v + d/2, z0 + h);
  const A = isoP(u,v,z0), B = isoP(u+w,v,z0), C = isoP(u+w,v+d,z0), D = isoP(u,v+d,z0);
  return pg([A,B,R2,R1], c.top) + pg([D,C,R2,R1], c.left) + pg([B,C,R2], c.right);
}
function pyramid(u, v, z0, w, d, h, c) {
  const apex = isoP(u + w/2, v + d/2, z0 + h);
  return pg([isoP(u,v+d,z0), isoP(u+w,v+d,z0), apex], c.left)
       + pg([isoP(u+w,v,z0), isoP(u+w,v+d,z0), apex], c.right);
}
function circleAt(u, v, z, r, fill, cls) {
  const p = isoP(u, v, z);
  return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${fill}"${cls ? ` class="${cls}"` : ''}/>`;
}
function ellipseAt(u, v, z, rx, ry, fill, extra) {
  const p = isoP(u, v, z);
  return `<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="${rx}" ry="${ry}" fill="${fill}"${extra || ''}/>`;
}
function frontQuad(u0, u1, vf, z0, z1, fill) {
  return pg([isoP(u0,vf,z1), isoP(u1,vf,z1), isoP(u1,vf,z0), isoP(u0,vf,z0)], fill);
}
function isoTree(u, v, big) {
  const s = big ? 1 : 0.75;
  return box(u-0.06, v-0.06, 0, 0.12, 0.12, 0.5*s, shades(25, 50, 35))
       + circleAt(u, v, 0.85*s, 13*s, '#4ca85b')
       + circleAt(u-0.14, v+0.1, 0.6*s, 9*s, '#5cbf6b');
}
function spin(dur) {
  return `<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="${dur}s" repeatCount="indefinite"/>`;
}

/* --- たてもの 20しゅるい --- */
const HOUSE_HUES = [12, 190, 45, 330, 105, 265];
const B = {
  factory(u, v) {
    const top = isoP(u+1.5, v+0.82, 1.5);
    return box(u+0.35, v+0.6, 0, 1.4, 1.0, 0.75, shades(210, 16, 62))
      + frontQuad(u+0.55, u+0.85, v+1.6, 0.25, 0.55, '#ffe9a8')
      + frontQuad(u+1.05, u+1.35, v+1.6, 0.25, 0.55, '#ffe9a8')
      + box(u+1.38, v+0.7, 0.75, 0.24, 0.24, 0.75, shades(210, 16, 45))
      + `<circle class="smoke" cx="${top[0]}" cy="${top[1]}" r="8" fill="#cfd8df"/>`
      + `<circle class="smoke s2" cx="${top[0]}" cy="${top[1]}" r="8" fill="#cfd8df"/>`;
  },
  house(u, v, s) {
    const hh = HOUSE_HUES[s % HOUSE_HUES.length];
    return box(u+0.5, v+0.5, 0, 1.1, 1.1, 0.6, shades(40, 45, 82))
      + roofP(u+0.4, v+0.4, 0.6, 1.3, 1.3, 0.5, shades(hh, 60, 50))
      + frontQuad(u+0.85, u+1.15, v+1.6, 0, 0.42, '#8a5a33')
      + frontQuad(u+0.58, u+0.78, v+1.6, 0.2, 0.42, '#c9ecff');
  },
  trees(u, v, s) {
    return isoTree(u+0.7, v+0.8, true) + isoTree(u+1.35, v+1.25, false)
      + (s % 2 ? isoTree(u+1.15, v+0.5, false) : circleAt(u+1.3, v+0.7, 0.06, 4, '#ff5d8f'));
  },
  shop(u, v, s) {
    const hh = s % 2 ? 150 : 5;
    return box(u+0.4, v+0.5, 0, 1.3, 1.1, 0.7, shades(38, 75, 86))
      + box(u+0.35, v+1.55, 0.42, 1.4, 0.16, 0.12, shades(hh, 70, 55))
      + frontQuad(u+0.85, u+1.2, v+1.6, 0, 0.4, '#8a5a33')
      + frontQuad(u+0.5, u+0.78, v+1.6, 0.12, 0.38, '#c9ecff')
      + box(u+0.6, v+0.55, 0.7, 0.9, 0.1, 0.22, shades(hh, 70, 60));
  },
  park(u, v) {

/* マスに割り当てるたてものの順番 (それ以降はループ+色違い) */
const TOWN_SEQ = [
  ['factory', 0], ['house', 0], ['trees', 0], ['shop', 0], ['park', 0],
  ['house', 1], ['apartment', 0], ['tower', 0], ['conv', 0], ['house', 2],
  ['castle', 0], ['fountain', 0], ['trees', 1], ['school', 0], ['house', 3],
  ['windmill', 0], ['hospital', 0], ['mountain', 0], ['shop', 1], ['shrine', 0],
  ['ferris', 0], ['house', 4], ['stadium', 0], ['apartment', 1], ['skytree', 0],
  ['park', 0], ['house', 5], ['rocket', 0], ['lake', 0], ['trees', 0]
];
function buildingForTile(k) {
  if (k < TOWN_SEQ.length) return TOWN_SEQ[k];
  const [name] = TOWN_SEQ[(k * 7 + 3) % TOWN_SEQ.length];
  return [name, k];
}

/* うずまき状のマス座標 */
function spiralCoords(n) {
  const coords = [[0, 0]];
  const dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  let x = 0, y = 0, len = 1, dirIdx = 0;
  while (coords.length < n) {
    for (let rep = 0; rep < 2 && coords.length < n; rep++) {
      const [dx, dy] = dirs[dirIdx % 4];
      for (let i = 0; i < len && coords.length < n; i++) {
        x += dx; y += dy;
        coords.push([x, y]);
      }
      dirIdx++;
    }
    len++;
  }
  return coords;
}

let townAnim = null;
let walkers = [];

function townOpen() { return !document.getElementById('townOverlay').hidden; }

function showTown() {
  const scene = document.getElementById('townScene');
  scene.innerHTML = '';
  const pop = collection.length;
  document.getElementById('townPop').textContent = pop;

  // 街の広さは「今までに作った総数」基準 (がったいで人口が減っても街は縮まない)
  const tiles = tileCountFor(Math.max(robotCount, pop));
  const hint = document.getElementById('townHint');
  if (tiles >= TILES_MAX) {
    hint.textContent = 'まちは さいだいきゅう! 🎉';
  } else {
    hint.textContent = `あと ${tiles * 3 - Math.max(robotCount, pop)} たいで まちが ひろがる!`;
  }

  scene.insertAdjacentHTML('beforeend', '<div class="town-sun">☀️</div>');
  [[8, 6, 0], [40, 3, -14], [70, 10, -26]].forEach(([l, t, d]) => {
    scene.insertAdjacentHTML('beforeend',
      `<div class="town-cloud" style="left:${l}%;top:${t}%;animation-delay:${d}s">☁️</div>`);
  });

  walkers = [];
  if (pop === 0) {
    scene.insertAdjacentHTML('beforeend',
      '<div class="town-empty">まだ だれも いないよ。<br>ロボットを つくって まちに よぼう!</div>');
    document.getElementById('townOverlay').hidden = false;
    return;
  }

  /* --- マスとたてもの --- */
  const TSP = 2.06;                        // マスの間隔 (すきま付き)
  const coords = spiralCoords(tiles);
  const grounds = [];
  const entities = [];
  const grass = { top: '#7fd97c', left: '#8a5a33', right: '#6e4426' };

  coords.forEach(([gx, gy], k) => {
    const u = gx * TSP, v = gy * TSP;
    grounds.push({ depth: u + v, svg:
      box(u, v, -0.34, 2, 2, 0.34, grass)
      + pg([isoP(u,v,0), isoP(u+2,v,0), isoP(u+2,v+2,0), isoP(u,v+2,0)], k % 2 ? '#86d97c' : '#7fd97c') });
    const [name, seed] = buildingForTile(k);
    entities.push({ depth: u + v + 2, svg: B[name](u, v, seed) });
  });

  /* --- じゅうみんロボット --- */
  const residents = collection.slice(-30);
  const robotMeta = [];
  residents.forEach((spec, i) => {
    const [gx, gy] = coords[i % tiles];
    const tu = gx * TSP, tv = gy * TSP;
    const ru = tu + 0.35 + Math.random() * 1.3;
    const rv = tv + 0.5 + Math.random() * 1.2;
    const inner = robotSvgMarkup(spec, true).replace('id="robotBody"', '');
    const mult = spec.fusion === 2 ? 2.1 : spec.fusion ? 1.5 : 1;
    const idx = robotMeta.length;
    robotMeta.push({ tu, ru, rv, dir: Math.random() > 0.5 ? 1 : -1,
      speed: 0.12 + Math.random() * 0.2, pauseUntil: 0,
      nextThink: performance.now() + 1000 + Math.random() * 3000 });
    entities.push({ depth: ru + rv, svg:
      `<g class="iso-robot" data-ridx="${idx}"><g class="iso-bob" style="animation-delay:${(Math.random()*0.5).toFixed(2)}s">`
      + `<g transform="scale(${(0.16 * mult).toFixed(3)}) translate(-100,-236)">${inner}</g></g></g>` });
  });

  grounds.sort((a, b) => a.depth - b.depth);
  entities.sort((a, b) => a.depth - b.depth);

  /* --- viewBoxをまちの大きさに合わせる --- */
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  coords.forEach(([gx, gy]) => {
    const u = gx * TSP, v = gy * TSP;
    [isoP(u,v,0), isoP(u+2,v,0), isoP(u+2,v+2,0), isoP(u,v+2,0)].forEach(p => {
      minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
      minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
    });
  });
  const pad = 40, top = 3.2 * ISO;
  const vb = `${(minX - pad).toFixed(0)} ${(minY - top).toFixed(0)} ${(maxX - minX + pad * 2).toFixed(0)} ${(maxY - minY + top + pad + 20).toFixed(0)}`;

  scene.insertAdjacentHTML('beforeend',
    `<svg id="townSvg" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">`
    + `<g>${grounds.map(g => g.svg).join('')}</g>`
    + `<g>${entities.map(e => e.svg).join('')}</g></svg>`);

  /* ロボットのタップと徘徊 */
  const gEls = scene.querySelectorAll('.iso-robot');
  gEls.forEach(g => {
    const meta = robotMeta[Number(g.dataset.ridx)];
    meta.el = g;
    const set = () => {
      const p = isoP(meta.ru, meta.rv, 0);
      g.setAttribute('transform', `translate(${p[0].toFixed(1)} ${p[1].toFixed(1)}) scale(${meta.dir},1)`);
    };
    meta.apply = set;
    set();
    g.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      ensureAudio();
      soundBeep();
      g.classList.remove('jump');
      void g.getBBox();
      g.classList.add('jump');
    });
  });
  walkers = robotMeta;

  document.getElementById('townOverlay').hidden = false;
  let last = performance.now();
  const step = (now) => {
    if (!townOpen()) { townAnim = null; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    walkers.forEach(wk => {
      if (!wk.el) return;
      if (now >= wk.nextThink) {
        wk.nextThink = now + 1500 + Math.random() * 4000;
        if (Math.random() < 0.4) wk.pauseUntil = now + 800 + Math.random() * 2000;
        else { wk.dir = Math.random() > 0.5 ? 1 : -1; wk.speed = 0.12 + Math.random() * 0.2; }
      }
      if (now < wk.pauseUntil) { wk.apply(); return; }
      wk.ru += wk.speed * dt * wk.dir;
      if (wk.ru < wk.tu + 0.3) { wk.ru = wk.tu + 0.3; wk.dir = 1; }
      if (wk.ru > wk.tu + 1.7) { wk.ru = wk.tu + 1.7; wk.dir = -1; }
      wk.apply();
    });
    townAnim = requestAnimationFrame(step);
  };
  if (townAnim) cancelAnimationFrame(townAnim);
  townAnim = requestAnimationFrame(step);
}

function hideTown() {
  document.getElementById('townOverlay').hidden = true;
  if (townAnim) { cancelAnimationFrame(townAnim); townAnim = null; }
  walkers = [];
}

/* ================= がったい ================= */
let gattaiCount = Number(localStorage.getItem('gattaiCount') || 0);
let selectMode = 0;          // 0=通常 / 2=がったい選択中 / 5=ちょうがったい選択中
let selectedIdx = [];
let fusion = null;           // {parents, code, pos, super, resolved}

function fusionOpen() { return !document.getElementById('fusionOverlay').hidden; }

function beginSelect(n) {
  ensureAudio();
  const hint = document.getElementById('fuseHint');
  hint.hidden = false;
  if (collection.length < n) {
    hint.textContent = `ロボットが ${n}たい いないと ${n === 5 ? 'ちょう' : ''}がったい できないよ!`;
    selectMode = 0;
    return;
  }
  selectMode = n;
  selectedIdx = [];
  document.querySelectorAll('.g-cell.sel').forEach(c => c.classList.remove('sel'));
  updateFuseHint();
  say(`がったいする ロボットを ${n}たい えらんでね`);
}

function updateFuseHint() {
  if (!selectMode) return;
  document.getElementById('fuseHint').textContent =
    `${selectMode === 5 ? '🌟ちょうがったい' : '⚡がったい'}する ロボットを ${selectMode}たい タッチ! (いま ${selectedIdx.length}たい)`;
}

function makeFusionSpec(parents, isSuper) {
  const a = parents[0], b = parents[1] || parents[0];
  return {
    h: a.h,
    h2: b.h,
    head: a.head || 0,
    body: b.body,
    eye: b.eye,
    mouth: a.mouth,
    ant: a.ant,
    fusion: isSuper ? 2 : 1
  };
}

function startFusion(indices, isSuper) {
  selectMode = 0;
  const parents = indices.map(i => collection[i]);
  hideGallery();
  const code = [];
  for (let i = 0; i < 5; i++) code.push(CHARS[Math.floor(Math.random() * CHARS.length)]);
  fusion = { parents, code, pos: 0, super: isSuper, resolved: false };

  const stage = document.getElementById('fusionStage');
  stage.innerHTML = '';
  parents.forEach((sp, i) => {
    const d = document.createElement('div');
    d.className = 'f-bot';
    const n = parents.length;
    d.style.left = (n === 2 ? (i === 0 ? 6 : 74) : 2 + i * 19.5) + '%';
    d.appendChild(miniRobotSvg(sp));
    stage.appendChild(d);
  });

  document.getElementById('fusionLabel').textContent =
    isSuper ? '🌟ちょうがったいコードを うちこめ!' : '⚡がったいコードを うちこめ!';
  renderFusionCode();
  document.getElementById('fusionOverlay').hidden = false;
  document.querySelectorAll('.key').forEach(k => k.classList.toggle('target', k.dataset.key === code[0]));
  say(isSuper ? 'ちょうがったいコードを うちこめ!' : 'がったいコードを うちこめ!');
}

function renderFusionCode() {
  const el = document.getElementById('fusionCode');
  el.innerHTML = '';
  fusion.code.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'f-ch' + (i < fusion.pos ? ' done' : i === fusion.pos ? ' cur' : '');
    d.textContent = c;
    el.appendChild(d);
  });
}

function fusionInput(ch) {
  if (!fusion || fusion.resolved) return;
  if (ch === fusion.code[fusion.pos]) {
    fusion.pos++;
    soundPop();
    renderFusionCode();
    document.querySelectorAll('.f-bot').forEach(b => {
      b.classList.remove('charge');
      void b.offsetWidth;
      b.classList.add('charge');
    });
    if (fusion.pos >= fusion.code.length) {
      finishFusion();
    } else {
      const next = fusion.code[fusion.pos];
      document.querySelectorAll('.key').forEach(k => k.classList.toggle('target', k.dataset.key === next));
      say(CHAR_NAMES[next] || next);
    }
  } else {
    soundWrong();
  }
}

function finishFusion() {
  fusion.resolved = true;
  document.querySelectorAll('.key').forEach(k => k.classList.remove('target'));
  document.getElementById('fusionLabel').textContent = 'がったい かいし!!';

  document.querySelectorAll('.f-bot').forEach(b => {
    b.style.left = '50%';
    b.style.transform = 'translate(-50%, -50%) scale(0.25) rotate(720deg)';
    setTimeout(() => { b.style.opacity = '0'; }, 620);
  });
  const flash = document.getElementById('fusionFlash');
  setTimeout(() => {
    flash.classList.remove('go');
    void flash.offsetWidth;
    flash.classList.add('go');
  }, 650);

  setTimeout(() => {
    const spec = makeFusionSpec(fusion.parents, fusion.super);
    const parentSet = new Set(fusion.parents);
    collection = collection.filter(s => !parentSet.has(s));
    collection.push(spec);
    localStorage.setItem('robotCollection2', JSON.stringify(collection));
    gattaiCount++;
    localStorage.setItem('gattaiCount', String(gattaiCount));

    const stage = document.getElementById('fusionStage');
    stage.innerHTML = '';
    const res = document.createElement('div');
    res.className = 'f-result';
    res.appendChild(miniRobotSvg(spec));
    stage.appendChild(res);
    void res.offsetWidth;
    res.classList.add('shown');
    document.getElementById('fusionCode').innerHTML = '';
    document.getElementById('fusionLabel').textContent =
      fusion.super ? '🌟ちょうがったい せいこう!!' : '⚡がったい せいこう!!';
    soundFanfare();
    confetti();
    say(fusion.super ? 'ちょうがったい! かっこいい!' : 'がったーい! かっこいい!');
    if (!fusion.super && gattaiCount === 10) {
      setTimeout(() => say('ちょうがったいが つかえるように なったよ!'), 3000);
    }
  }, 900);

  setTimeout(() => {
    document.getElementById('fusionOverlay').hidden = true;
    fusion = null;
    // メインゲームのキーボードハイライトを復元
    document.querySelectorAll('.key').forEach(k => {
      k.classList.toggle('target', state === 'playing' && k.dataset.key === target);
    });
  }, 4500);
}

/* ================= ゲーム進行 ================= */
function nextTarget() {
  let next;
  do { next = CHARS[Math.floor(Math.random() * CHARS.length)]; } while (next === target);
  target = next;
  document.getElementById('targetChar').textContent = target;
  document.querySelectorAll('.key').forEach(k => {
    k.classList.toggle('target', k.dataset.key === target);
  });
  say(CHAR_NAMES[target] || target);
}

function newRobot() {
  partsDone = 0;
  buildRobot();
  updateLights();
  document.getElementById('targetLabel').textContent = 'この キーを おしてね!';
  state = 'playing';
  nextTarget();
}

function flashKey(ch, cls) {
  const k = document.querySelector(`.key[data-key="${ch}"]`);
  if (!k) return;
  k.classList.add(cls);
  setTimeout(() => k.classList.remove(cls), 250);
}

function handleInput(ch) {
  ensureAudio();
  if (fusionOpen()) { fusionInput(ch); return; }
  if (galleryOpen()) { if (!selectMode) hideGallery(); return; }
  if (townOpen()) return;
  if (state === 'start') { startGame(); return; }
  if (state !== 'playing') return;
  if (!CHARS.includes(ch)) return;

  if (ch === target) {
    flashKey(ch, 'pressed');
    const part = document.querySelector(`#robotSvg .part[data-part="${partsDone}"]`);
    if (part) part.classList.add('shown');
    partsDone++;
    updateLights();
    soundPop();
    showPraise();

    if (partsDone >= PARTS_PER_ROBOT) {
      completeRobot();
    } else {
      nextTarget();
    }
  } else {
    flashKey(ch, 'pressed');
    soundWrong();
    const stage = document.getElementById('stage');
    stage.classList.remove('wobble');
    void stage.offsetWidth;
    stage.classList.add('wobble');
  }
}

function completeRobot() {
  state = 'celebrate';
  robotCount++;
  localStorage.setItem('robotCount', String(robotCount));
  updateCount();

  const isNew = !collection.some(s => specKey(s) === specKey(currentSpec));
  const prevTiles = tileCountFor(robotCount - 1);
  collection.push(currentSpec);
  if (collection.length > 500) collection = collection.slice(-500);
  localStorage.setItem('robotCollection2', JSON.stringify(collection));
  const gotBuilding = tileCountFor(robotCount) > prevTiles;

  document.getElementById('targetChar').textContent = '🎉';
  document.getElementById('targetLabel').textContent = 'ロボット かんせい!';
  document.querySelectorAll('.key').forEach(k => k.classList.remove('target'));

  const stage = document.getElementById('stage');
  stage.classList.add('dance');
  soundFanfare();
  confetti();
  if (gotBuilding) {
    showPraise('🏗 まちが ひろがったよ!', 'new-building');
    say('ロボット かんせい! まちが ひろがったよ!');
  } else if (isNew) {
    showPraise('✨あたらしい ロボット!✨', 'new-robot');
    say('あたらしい ロボット かんせい! すごい!');
  } else {
    say('ロボット かんせい! すごい!');
  }

  setTimeout(() => {
    stage.classList.remove('dance');
    newRobot();
  }, 3200);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  state = 'playing';
  newRobot();
}

/* ================= 入力イベント ================= */
document.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  ensureAudio();
  if (fusionOpen()) {
    e.preventDefault();
    const ch = e.key.length === 1 ? e.key.toUpperCase() : null;
    if (ch && CHARS.includes(ch)) fusionInput(ch);
    return;
  }
  if (galleryOpen()) { e.preventDefault(); hideGallery(); return; }
  if (townOpen()) { e.preventDefault(); hideTown(); return; }
  if (state === 'start') { e.preventDefault(); startGame(); return; }
  const ch = e.key.length === 1 ? e.key.toUpperCase() : null;
  if (ch && CHARS.includes(ch)) {
    e.preventDefault();
    handleInput(ch);
  }
});

document.getElementById('startScreen').addEventListener('pointerdown', () => {
  ensureAudio();
  startGame();
});

document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  localStorage.setItem('robotMuted', muted ? '1' : '0');
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});

document.getElementById('galleryBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  hideTown();
  showGallery();
});
document.getElementById('closeGallery').addEventListener('click', hideGallery);
document.getElementById('fuseBtn').addEventListener('click', (e) => { e.stopPropagation(); beginSelect(2); });
document.getElementById('superFuseBtn').addEventListener('click', (e) => { e.stopPropagation(); beginSelect(5); });
document.getElementById('galleryOverlay').addEventListener('pointerdown', (e) => {
  if (e.target.id === 'galleryOverlay') hideGallery();
});

document.getElementById('townBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  hideGallery();
  showTown();
});
document.getElementById('closeTown').addEventListener('click', hideTown);

/* iPadのピンチズーム・ダブルタップズームを止める */
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

/* ================= 初期化 ================= */
function addStars() {
  const screen = document.getElementById('startScreen');
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = Math.random() > 0.5 ? '✦' : '⭐';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.fontSize = 8 + Math.random() * 16 + 'px';
    s.style.animationDelay = Math.random() * 2 + 's';
    screen.appendChild(s);
  }
}

buildKeyboard();
buildLights();
updateCount();
document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
document.getElementById('startRobot').appendChild(
  miniRobotSvg({ h: 200, body: 0, head: 0, eye: 0, mouth: 0, ant: 0 }).firstElementChild || document.createElementNS('http://www.w3.org/2000/svg','g')
);
addStars();
</script>
</body>
</html>
