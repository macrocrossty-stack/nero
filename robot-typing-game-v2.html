<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ロボットこうじょう">
<meta name="theme-color" content="#aee7ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="robot-icon-180.png">
<link rel="icon" type="image/png" href="robot-icon-180.png">
<title>ロボットこうじょう v2 - タイピングゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  :root {
    --bg-top: #aee7ff;
    --bg-bottom: #e8f9ff;
    --card: #ffffff;
    --ink: #234;
    --accent: #ff8c42;
  }

  html { height: 100%; overflow: hidden; overscroll-behavior: none; }

  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Yu Gothic', sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }

  /* ===== ヘッダー ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: max(10px, env(safe-area-inset-top)) 18px 6px;
    flex: 0 0 auto;
  }
  header h1 {
    font-size: clamp(16px, 3vw, 28px);
    color: #1a6fa8;
    text-shadow: 0 2px 0 #fff;
    white-space: nowrap;
  }
  .robot-count {
    background: var(--card);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: clamp(13px, 2.2vw, 20px);
    font-weight: bold;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    white-space: nowrap;
  }
  .robot-count span { color: var(--accent); font-size: 1.3em; }
  .hdr-btn {
    font-size: clamp(16px, 2.5vw, 24px);
    font-family: inherit;
    font-weight: bold;
    background: var(--card);
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    color: #1a6fa8;
    white-space: nowrap;
  }

  /* ===== メイン ===== */
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3vw;
    padding: 0 3vw;
    min-height: 0;
  }

  .target-card {
    background: var(--card);
    border-radius: 28px;
    padding: 1.5vh 3vw 2.5vh;
    text-align: center;
    box-shadow: 0 8px 0 rgba(26,111,168,0.15);
    min-width: 24vw;
  }
  .target-label {
    font-size: clamp(15px, 2.4vw, 24px);
    color: #557;
    margin-bottom: 0.5vh;
  }
  #targetChar {
    font-size: clamp(80px, 15vw, 190px);
    font-weight: bold;
    line-height: 1.1;
    color: var(--accent);
    animation: charPulse 1.2s ease-in-out infinite;
  }
  @keyframes charPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .progress-lights {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 1vh;
  }
  .light {
    width: clamp(13px, 2vw, 22px);
    height: clamp(13px, 2vw, 22px);
    border-radius: 50%;
    background: #dde5ec;
    transition: background 0.3s, transform 0.3s;
  }
  .light.on {
    background: #ffd23f;
    box-shadow: 0 0 10px #ffd23f;
    transform: scale(1.2);
  }

  .stage {
    position: relative;
    width: clamp(200px, 30vw, 400px);
    height: clamp(230px, 48vh, 460px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #robotSvg { width: 100%; height: 100%; overflow: visible; }

  .part { opacity: 0; }
  .part.shown {
    opacity: 1;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center;
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: translateY(-40px) scale(0.3); }
    70%  { opacity: 1; transform: translateY(5px) scale(1.1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .stage.dance #robotBody { animation: dance 0.5s ease-in-out 5; transform-origin: 50% 90%; }
  @keyframes dance {
    0%, 100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-6deg) translateY(-14px); }
    75% { transform: rotate(6deg) translateY(-14px); }
  }
  .stage.wobble #robotBody { animation: wobble 0.35s ease-in-out; transform-origin: 50% 90%; }
  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-3deg); }
    70% { transform: rotate(3deg); }
  }

  .antenna-light { animation: blinkLight 1s ease-in-out infinite; }
  @keyframes blinkLight {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .praise {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    font-size: clamp(26px, 5vw, 56px);
    font-weight: bold;
    color: #ff5d8f;
    text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,0.15);
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    white-space: nowrap;
  }
  .praise.new-robot { color: #7c3aed; font-size: clamp(24px, 4.2vw, 46px); }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  /* ===== キーボードヒント ===== */
  .kb {
    flex: 0 0 auto;
    padding: 1vh 2vw max(2vh, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .kb-row { display: flex; gap: 6px; }
  .key {
    width: clamp(24px, 4.2vw, 52px);
    height: clamp(24px, 4.2vw, 52px);
    background: var(--card);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px, 2vw, 24px);
    font-weight: bold;
    color: #789;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    cursor: pointer;
  }
  .key.target {
    background: #ffd23f;
    color: #a33;
    animation: keyGlow 0.8s ease-in-out infinite;
  }
  @keyframes keyGlow {
    0%, 100% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 0 rgba(255,210,63,0.8); transform: scale(1); }
    50% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 12px rgba(255,210,63,0); transform: scale(1.15); }
  }
  .key.pressed { background: #b8e986; transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }

  /* ===== スタート画面 ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #1b2a4a, #2c4a7c);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    z-index: 10;
    cursor: pointer;
  }
  #startScreen h2 {
    color: #fff;
    font-size: clamp(28px, 6vw, 64px);
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
  }
  #startScreen p {
    color: #ffd23f;
    font-size: clamp(16px, 3vw, 32px);
    text-align: center;
    padding: 0 4vw;
    animation: charPulse 1.2s ease-in-out infinite;
  }
  #startScreen .star {
    position: absolute;
    color: #fff;
    animation: blinkLight 2s ease-in-out infinite;
  }
  #startRobot { width: clamp(130px, 20vw, 250px); }

  /* ===== ロボットずかん ===== */
  #galleryOverlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 40, 70, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 4vh 4vw;
  }
  #galleryOverlay[hidden] { display: none; }
  .gallery-panel {
    background: var(--card);
    border-radius: 24px;
    width: min(900px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 0 rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .gallery-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: #eaf6ff;
  }
  .gallery-head h3 { font-size: clamp(18px, 3vw, 26px); color: #1a6fa8; }
  #closeGallery {
    font-size: clamp(20px, 3vw, 28px);
    background: #ff5d8f;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 1.8em; height: 1.8em;
    cursor: pointer;
    line-height: 1;
  }
  .gallery-grid {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(70px, 12vw, 110px), 1fr));
    gap: 8px;
    padding: 16px;
  }
  .gallery-grid svg { width: 100%; height: auto; }
  .gallery-empty {
    padding: 30px;
    text-align: center;
    font-size: clamp(15px, 2.5vw, 22px);
    color: #789;
  }

  .confetti {
    position: fixed;
    top: -20px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 5;
  }

  /* ===== iPadたて向き・せまい画面 ===== */
  @media (max-width: 820px), (orientation: portrait) {
    main { flex-direction: column; gap: 1vh; }
    .target-card { padding: 1vh 8vw 1.5vh; }
    #targetChar { font-size: clamp(64px, 18vw, 120px); }
    .stage { height: clamp(180px, 32vh, 320px); }
  }
</style>
</head>
<body>

<div id="startScreen">
  <h2>🤖 ロボットこうじょう</h2>
  <svg id="startRobot" viewBox="0 0 200 240"></svg>
  <p>がめんタッチか どれかのキーを おしてスタート!</p>
</div>

<header>
  <h1>🤖 ロボットこうじょう</h1>
  <div class="robot-count">つくった: <span id="count">0</span> たい</div>
  <button class="hdr-btn" id="galleryBtn">📖 ずかん</button>
  <button class="hdr-btn" id="muteBtn" title="おとの ON/OFF">🔊</button>
</header>

<main>
  <div class="target-card">
    <div class="target-label" id="targetLabel">この キーを おしてね!</div>
    <div id="targetChar">A</div>
    <div class="progress-lights" id="lights"></div>
  </div>
  <div class="stage" id="stage">
    <svg id="robotSvg" viewBox="0 0 200 240"></svg>
  </div>
</main>

<div class="kb" id="kb"></div>

<div id="galleryOverlay" hidden>
  <div class="gallery-panel">
    <div class="gallery-head">
      <h3>📖 ロボットずかん (<span id="galleryCount">0</span> たい)</h3>
      <button id="closeGallery">✕</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<script>
'use strict';

/* ================= 設定 ================= */
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
const PARTS_PER_ROBOT = 5;
const PRAISES = ['すごい!', 'やったね!', 'ピッタリ!', 'てんさい!', 'いいね!', 'その ちょうし!'];
const CHAR_NAMES = {
  A:'エー', B:'ビー', C:'シー', D:'ディー', E:'イー', F:'エフ', G:'ジー',
  H:'エイチ', I:'アイ', J:'ジェー', K:'ケー', L:'エル', M:'エム', N:'エヌ',
  O:'オー', P:'ピー', Q:'キュー', R:'アール', S:'エス', T:'ティー',
  U:'ユー', V:'ブイ', W:'ダブリュー', X:'エックス', Y:'ワイ', Z:'ゼット',
  0:'ゼロ', 1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご',
  6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'
};
const KB_ROWS = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];
const HUES = [0, 25, 50, 90, 140, 170, 200, 225, 260, 290, 320, 345];

/* ================= 状態 ================= */
let state = 'start';          // start | playing | celebrate
let target = null;
let partsDone = 0;
let currentSpec = null;
let robotCount = Number(localStorage.getItem('robotCount') || 0);
let collection = [];
try { collection = JSON.parse(localStorage.getItem('robotCollection2') || '[]'); } catch (e) {}
let muted = localStorage.getItem('robotMuted') === '1';

/* ================= サウンド ================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, start, dur, type, vol) {
  if (!audioCtx || muted) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  const t = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function soundPop()     { tone(520, 0, 0.12); tone(780, 0.08, 0.15); }
function soundWrong()   { tone(180, 0, 0.2, 'sine', 0.1); }
function soundFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.15, 0.3, 'triangle', 0.2));
  [523, 659, 784, 1047].forEach((f, i) => tone(f * 2, i * 0.15 + 0.05, 0.25, 'sine', 0.08));
}

function say(text) {
  if (muted || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  u.pitch = 1.2;
  speechSynthesis.speak(u);
}

/* ================= ロボットの設計図 =================
   body(3) × eye(3) × mouth(3) × ant(3) × いろ(12) = 972 パターン */
function randomSpec() {
  return {
    h: HUES[Math.floor(Math.random() * HUES.length)],
    body: Math.floor(Math.random() * 3),
    eye: Math.floor(Math.random() * 3),
    mouth: Math.floor(Math.random() * 3),
    ant: Math.floor(Math.random() * 3)
  };
}
function specKey(s) { return [s.h, s.body, s.eye, s.mouth, s.ant].join('-'); }

function robotSvgMarkup(spec, withAll) {
  const body = `hsl(${spec.h}, 70%, 55%)`;
  const dark = `hsl(${spec.h}, 70%, 38%)`;
  const lite = `hsl(${(spec.h + 40) % 360}, 80%, 65%)`;
  const cls = withAll ? 'part shown' : 'part';

  let torso;
  let armL = 34, armR = 146;
  if (spec.body === 0) {
    torso = `<rect x="58" y="118" width="84" height="84" rx="16" fill="${body}"/>
             <rect x="74" y="136" width="52" height="34" rx="8" fill="${lite}"/>
             <circle cx="88" cy="184" r="7" fill="#ffd23f"/>
             <circle cx="112" cy="184" r="7" fill="#ff5d8f"/>`;
  } else if (spec.body === 1) {
    torso = `<circle cx="100" cy="162" r="45" fill="${body}"/>
             <circle cx="100" cy="152" r="20" fill="${lite}"/>
             <circle cx="86" cy="188" r="6" fill="#ffd23f"/>
             <circle cx="114" cy="188" r="6" fill="#ff5d8f"/>`;
    armL = 36; armR = 144;
  } else {
    torso = `<rect x="68" y="112" width="64" height="92" rx="12" fill="${body}"/>
             <rect x="80" y="126" width="40" height="26" rx="6" fill="${lite}"/>
             <circle cx="100" cy="170" r="6" fill="#ffd23f"/>
             <circle cx="100" cy="186" r="6" fill="#ff5d8f"/>`;
    armL = 46; armR = 134;
  }

  let eyes;
  if (spec.eye === 0) {
    eyes = `<circle cx="82" cy="52" r="9" fill="#fff"/><circle cx="118" cy="52" r="9" fill="#fff"/>
            <circle cx="84" cy="54" r="4.5" fill="#234"/><circle cx="116" cy="54" r="4.5" fill="#234"/>`;
  } else if (spec.eye === 1) {
    eyes = `<rect x="72" y="45" width="18" height="14" rx="4" fill="#9ef"/><rect x="110" y="45" width="18" height="14" rx="4" fill="#9ef"/>`;
  } else {
    eyes = `<circle cx="82" cy="52" r="8" fill="#ffd23f"/><circle cx="118" cy="52" r="8" fill="#ffd23f"/>
            <circle cx="82" cy="52" r="3" fill="#234"/><circle cx="118" cy="52" r="3" fill="#234"/>`;
  }

  let mouth;
  if (spec.mouth === 0) {
    mouth = `<rect x="82" y="72" width="36" height="10" rx="5" fill="#234"/>
             <rect x="86" y="74" width="6" height="6" fill="${lite}"/>
             <rect x="96" y="74" width="6" height="6" fill="${lite}"/>
             <rect x="106" y="74" width="6" height="6" fill="${lite}"/>`;
  } else if (spec.mouth === 1) {
    mouth = `<path d="M84 72 Q100 86 116 72" stroke="#234" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  } else {
    mouth = `<rect x="84" y="70" width="32" height="3.5" rx="1.5" fill="#234"/>
             <rect x="84" y="76" width="32" height="3.5" rx="1.5" fill="#234"/>
             <rect x="84" y="82" width="32" height="3.5" rx="1.5" fill="#234"/>`;
  }

  let antenna;
  if (spec.ant === 0) {
    antenna = `<rect x="97" y="8" width="6" height="22" fill="${dark}"/>
               <circle class="antenna-light" cx="100" cy="8" r="8" fill="#ff5d8f"/>`;
  } else if (spec.ant === 1) {
    antenna = `<rect x="74" y="12" width="5" height="18" fill="${dark}"/>
               <rect x="121" y="12" width="5" height="18" fill="${dark}"/>
               <circle class="antenna-light" cx="76" cy="12" r="6" fill="#ff5d8f"/>
               <circle class="antenna-light" cx="123" cy="12" r="6" fill="#ffd23f"/>`;
  } else {
    antenna = `<rect x="97" y="14" width="6" height="16" fill="${dark}"/>
               <path d="M82 16 Q100 -4 118 16 Z" fill="${lite}"/>
               <circle class="antenna-light" cx="100" cy="10" r="4" fill="#ff5d8f"/>`;
  }

  return `
  <g id="robotBody">
    <g class="${cls}" data-part="0">
      <rect x="72" y="196" width="20" height="30" rx="6" fill="${dark}"/>
      <rect x="108" y="196" width="20" height="30" rx="6" fill="${dark}"/>
      <rect x="62" y="222" width="36" height="14" rx="7" fill="${body}"/>
      <rect x="102" y="222" width="36" height="14" rx="7" fill="${body}"/>
    </g>
    <g class="${cls}" data-part="1">${torso}</g>
    <g class="${cls}" data-part="2">
      <rect x="${armL}" y="126" width="20" height="52" rx="10" fill="${dark}"/>
      <rect x="${armR}" y="126" width="20" height="52" rx="10" fill="${dark}"/>
      <circle cx="${armL + 10}" cy="184" r="12" fill="${lite}"/>
      <circle cx="${armR + 10}" cy="184" r="12" fill="${lite}"/>
    </g>
    <g class="${cls}" data-part="3">
      <rect x="88" y="90" width="24" height="30" fill="${dark}"/>
      <rect x="60" y="28" width="80" height="66" rx="18" fill="${body}"/>
      ${eyes}
      ${mouth}
    </g>
    <g class="${cls}" data-part="4">${antenna}</g>
  </g>`;
}

function buildRobot() {
  currentSpec = randomSpec();
  document.getElementById('robotSvg').innerHTML = robotSvgMarkup(currentSpec, false);
}

/* ================= 画面パーツ ================= */
function buildKeyboard() {
  const kb = document.getElementById('kb');
  KB_ROWS.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    row.forEach(ch => {
      const k = document.createElement('div');
      k.className = 'key';
      k.dataset.key = ch;
      k.textContent = ch;
      k.addEventListener('pointerdown', () => handleInput(ch));
      div.appendChild(k);
    });
    kb.appendChild(div);
  });
}

function buildLights() {
  const box = document.getElementById('lights');
  box.innerHTML = '';
  for (let i = 0; i < PARTS_PER_ROBOT; i++) {
    const d = document.createElement('div');
    d.className = 'light';
    box.appendChild(d);
  }
}

function updateLights() {
  document.querySelectorAll('.light').forEach((d, i) => {
    d.classList.toggle('on', i < partsDone);
  });
}

function updateCount() {
  document.getElementById('count').textContent = robotCount;
}

function showPraise(text, extraClass) {
  const p = document.createElement('div');
  p.className = 'praise' + (extraClass ? ' ' + extraClass : '');
  p.textContent = text || PRAISES[Math.floor(Math.random() * PRAISES.length)];
  document.getElementById('stage').appendChild(p);
  setTimeout(() => p.remove(), 1200);
}

function confetti() {
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random() * 8;
    c.style.width = size + 'px';
    c.style.height = size * (0.6 + Math.random()) + 'px';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = `hsl(${Math.floor(Math.random() * 360)}, 85%, 60%)`;
    document.body.appendChild(c);
    c.animate([
      { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
      { transform: `translateY(${window.innerHeight + 40}px) rotate(${360 + Math.random() * 720}deg)`, opacity: 0.8 }
    ], {
      duration: 1800 + Math.random() * 1500,
      delay: Math.random() * 400,
      easing: 'cubic-bezier(0.2, 0.6, 0.8, 1)'
    }).onfinish = () => c.remove();
  }
}

/* ================= ロボットずかん ================= */
function galleryOpen() { return !document.getElementById('galleryOverlay').hidden; }

function showGallery() {
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '';
  document.getElementById('galleryCount').textContent = collection.length;
  if (collection.length === 0) {
    grid.innerHTML = '<div class="gallery-empty">まだ ロボットが いないよ。<br>キーを おして つくってみよう!</div>';
  } else {
    collection.forEach(spec => {
      const holder = document.createElement('div');
      holder.innerHTML = `<svg viewBox="0 0 200 240">${robotSvgMarkup(spec, true)}</svg>`;
      const g = holder.querySelector('#robotBody');
      if (g) g.removeAttribute('id');
      grid.appendChild(holder.firstElementChild);
    });
  }
  document.getElementById('galleryOverlay').hidden = false;
}

function hideGallery() {
  document.getElementById('galleryOverlay').hidden = true;
}

/* ================= ゲーム進行 ================= */
function nextTarget() {
  let next;
  do { next = CHARS[Math.floor(Math.random() * CHARS.length)]; } while (next === target);
  target = next;
  document.getElementById('targetChar').textContent = target;
  document.querySelectorAll('.key').forEach(k => {
    k.classList.toggle('target', k.dataset.key === target);
  });
  say(CHAR_NAMES[target] || target);
}

function newRobot() {
  partsDone = 0;
  buildRobot();
  updateLights();
  document.getElementById('targetLabel').textContent = 'この キーを おしてね!';
  state = 'playing';
  nextTarget();
}

function flashKey(ch, cls) {
  const k = document.querySelector(`.key[data-key="${ch}"]`);
  if (!k) return;
  k.classList.add(cls);
  setTimeout(() => k.classList.remove(cls), 250);
}

function handleInput(ch) {
  ensureAudio();
  if (galleryOpen()) { hideGallery(); return; }
  if (state === 'start') { startGame(); return; }
  if (state !== 'playing') return;
  if (!CHARS.includes(ch)) return;

  if (ch === target) {
    flashKey(ch, 'pressed');
    const part = document.querySelector(`#robotSvg .part[data-part="${partsDone}"]`);
    if (part) part.classList.add('shown');
    partsDone++;
    updateLights();
    soundPop();
    showPraise();

    if (partsDone >= PARTS_PER_ROBOT) {
      completeRobot();
    } else {
      nextTarget();
    }
  } else {
    flashKey(ch, 'pressed');
    soundWrong();
    const stage = document.getElementById('stage');
    stage.classList.remove('wobble');
    void stage.offsetWidth;
    stage.classList.add('wobble');
  }
}

function completeRobot() {
  state = 'celebrate';
  robotCount++;
  localStorage.setItem('robotCount', String(robotCount));
  updateCount();

  const isNew = !collection.some(s => specKey(s) === specKey(currentSpec));
  collection.push(currentSpec);
  if (collection.length > 500) collection = collection.slice(-500);
  localStorage.setItem('robotCollection2', JSON.stringify(collection));

  document.getElementById('targetChar').textContent = '🎉';
  document.getElementById('targetLabel').textContent = 'ロボット かんせい!';
  document.querySelectorAll('.key').forEach(k => k.classList.remove('target'));

  const stage = document.getElementById('stage');
  stage.classList.add('dance');
  soundFanfare();
  confetti();
  if (isNew) {
    showPraise('✨あたらしい ロボット!✨', 'new-robot');
    say('あたらしい ロボット かんせい! すごい!');
  } else {
    say('ロボット かんせい! すごい!');
  }

  setTimeout(() => {
    stage.classList.remove('dance');
    newRobot();
  }, 3200);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  state = 'playing';
  newRobot();
}

/* ================= 入力イベント ================= */
document.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  ensureAudio();
  if (galleryOpen()) { e.preventDefault(); hideGallery(); return; }
  if (state === 'start') { e.preventDefault(); startGame(); return; }
  const ch = e.key.length === 1 ? e.key.toUpperCase() : null;
  if (ch && CHARS.includes(ch)) {
    e.preventDefault();
    handleInput(ch);
  }
});

document.getElementById('startScreen').addEventListener('pointerdown', () => {
  ensureAudio();
  startGame();
});

document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  localStorage.setItem('robotMuted', muted ? '1' : '0');
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});

document.getElementById('galleryBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  showGallery();
});
document.getElementById('closeGallery').addEventListener('click', hideGallery);
document.getElementById('galleryOverlay').addEventListener('pointerdown', (e) => {
  if (e.target.id === 'galleryOverlay') hideGallery();
});

/* iPadのピンチズーム・ダブルタップズームを止める */
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

/* ================= 初期化 ================= */
function addStars() {
  const screen = document.getElementById('startScreen');
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = Math.random() > 0.5 ? '✦' : '⭐';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.fontSize = 8 + Math.random() * 16 + 'px';
    s.style.animationDelay = Math.random() * 2 + 's';
    screen.appendChild(s);
  }
}

buildKeyboard();
buildLights();
updateCount();
document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
document.getElementById('startRobot').innerHTML =
  robotSvgMarkup({ h: 200, body: 0, eye: 0, mouth: 0, ant: 0 }, true);
document.querySelector('#startRobot #robotBody').removeAttribute('id');
addStars();
</script>
