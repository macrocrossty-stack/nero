<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロボットこうじょう - タイピングゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  :root {
    --bg-top: #aee7ff;
    --bg-bottom: #e8f9ff;
    --card: #ffffff;
    --ink: #234;
    --accent: #ff8c42;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', 'Yu Gothic', sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* ===== ヘッダー ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    flex: 0 0 auto;
  }
  header h1 {
    font-size: clamp(18px, 3vw, 28px);
    color: #1a6fa8;
    text-shadow: 0 2px 0 #fff;
  }
  .robot-count {
    background: var(--card);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: clamp(14px, 2.2vw, 20px);
    font-weight: bold;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .robot-count span { color: var(--accent); font-size: 1.3em; }
  #muteBtn {
    font-size: clamp(18px, 2.5vw, 26px);
    background: var(--card);
    border: none;
    border-radius: 50%;
    width: 2em; height: 2em;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }

  /* ===== メイン ===== */
  main {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4vw;
    padding: 0 3vw;
    min-height: 0;
  }

  .target-card {
    background: var(--card);
    border-radius: 28px;
    padding: 2vh 3vw 3vh;
    text-align: center;
    box-shadow: 0 8px 0 rgba(26,111,168,0.15);
    min-width: 26vw;
  }
  .target-label {
    font-size: clamp(16px, 2.4vw, 24px);
    color: #557;
    margin-bottom: 0.5vh;
  }
  #targetChar {
    font-size: clamp(90px, 16vw, 200px);
    font-weight: bold;
    line-height: 1.1;
    color: var(--accent);
    animation: charPulse 1.2s ease-in-out infinite;
  }
  @keyframes charPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .progress-lights {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 1vh;
  }
  .light {
    width: clamp(14px, 2vw, 22px);
    height: clamp(14px, 2vw, 22px);
    border-radius: 50%;
    background: #dde5ec;
    transition: background 0.3s, transform 0.3s;
  }
  .light.on {
    background: #ffd23f;
    box-shadow: 0 0 10px #ffd23f;
    transform: scale(1.2);
  }

  .stage {
    position: relative;
    width: clamp(220px, 32vw, 420px);
    height: clamp(260px, 52vh, 480px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #robotSvg { width: 100%; height: 100%; overflow: visible; }

  .part { opacity: 0; }
  .part.shown {
    opacity: 1;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center;
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: translateY(-40px) scale(0.3); }
    70%  { opacity: 1; transform: translateY(5px) scale(1.1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .stage.dance #robotBody { animation: dance 0.5s ease-in-out 5; transform-origin: 50% 90%; }
  @keyframes dance {
    0%, 100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-6deg) translateY(-14px); }
    75% { transform: rotate(6deg) translateY(-14px); }
  }
  .stage.wobble #robotBody { animation: wobble 0.35s ease-in-out; transform-origin: 50% 90%; }
  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-3deg); }
    70% { transform: rotate(3deg); }
  }

  .antenna-light { animation: blinkLight 1s ease-in-out infinite; }
  @keyframes blinkLight {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ほめことば ポップアップ */
  .praise {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    font-size: clamp(28px, 5vw, 56px);
    font-weight: bold;
    color: #ff5d8f;
    text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,0.15);
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
    30%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  /* ===== キーボードヒント ===== */
  .kb {
    flex: 0 0 auto;
    padding: 1vh 2vw 2vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .kb-row { display: flex; gap: 6px; }
  .key {
    width: clamp(26px, 4.2vw, 52px);
    height: clamp(26px, 4.2vw, 52px);
    background: var(--card);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(13px, 2vw, 24px);
    font-weight: bold;
    color: #789;
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    cursor: pointer;
  }
  .key.target {
    background: #ffd23f;
    color: #a33;
    animation: keyGlow 0.8s ease-in-out infinite;
  }
  @keyframes keyGlow {
    0%, 100% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 0 rgba(255,210,63,0.8); transform: scale(1); }
    50% { box-shadow: 0 3px 0 rgba(0,0,0,0.1), 0 0 0 12px rgba(255,210,63,0); transform: scale(1.15); }
  }
  .key.pressed { background: #b8e986; transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }

  /* ===== スタート画面 ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #1b2a4a, #2c4a7c);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    z-index: 10;
    cursor: pointer;
  }
  #startScreen h2 {
    color: #fff;
    font-size: clamp(30px, 6vw, 64px);
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
  }
  #startScreen p {
    color: #ffd23f;
    font-size: clamp(18px, 3vw, 32px);
    animation: charPulse 1.2s ease-in-out infinite;
  }
  #startScreen .star {
    position: absolute;
    color: #fff;
    animation: blinkLight 2s ease-in-out infinite;
  }
  #startRobot { width: clamp(140px, 22vw, 260px); }

  /* かみふぶき */
  .confetti {
    position: fixed;
    top: -20px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h2>🤖 ロボットこうじょう</h2>
  <svg id="startRobot" viewBox="0 0 200 240"></svg>
  <p>クリックか どれかのキーを おしてスタート!</p>
</div>

<header>
  <h1>🤖 ロボットこうじょう</h1>
  <div class="robot-count">つくったロボット: <span id="count">0</span> たい</div>
  <button id="muteBtn" title="おとの ON/OFF">🔊</button>
</header>

<main>
  <div class="target-card">
    <div class="target-label" id="targetLabel">この キーを おしてね!</div>
    <div id="targetChar">A</div>
    <div class="progress-lights" id="lights"></div>
  </div>
  <div class="stage" id="stage">
    <svg id="robotSvg" viewBox="0 0 200 240"></svg>
  </div>
</main>

<div class="kb" id="kb"></div>

<script>
'use strict';

/* ================= 設定 ================= */
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
const PARTS_PER_ROBOT = 5;
const PRAISES = ['すごい!', 'やったね!', 'ピッタリ!', 'てんさい!', 'いいね!', 'その ちょうし!'];
const CHAR_NAMES = {
  A:'エー', B:'ビー', C:'シー', D:'ディー', E:'イー', F:'エフ', G:'ジー',
  H:'エイチ', I:'アイ', J:'ジェー', K:'ケー', L:'エル', M:'エム', N:'エヌ',
  O:'オー', P:'ピー', Q:'キュー', R:'アール', S:'エス', T:'ティー',
  U:'ユー', V:'ブイ', W:'ダブリュー', X:'エックス', Y:'ワイ', Z:'ゼット',
  0:'ゼロ', 1:'いち', 2:'に', 3:'さん', 4:'よん', 5:'ご',
  6:'ろく', 7:'なな', 8:'はち', 9:'きゅう'
};
const KB_ROWS = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M']
];

/* ================= 状態 ================= */
let state = 'start';          // start | playing | celebrate
let target = null;
let partsDone = 0;
let robotCount = Number(localStorage.getItem('robotCount') || 0);
let muted = localStorage.getItem('robotMuted') === '1';
let hue = Math.floor(Math.random() * 360);

/* ================= サウンド ================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, start, dur, type, vol) {
  if (!audioCtx || muted) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  const t = audioCtx.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function soundPop()     { tone(520, 0, 0.12); tone(780, 0.08, 0.15); }
function soundWrong()   { tone(180, 0, 0.2, 'sine', 0.1); }
function soundFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.15, 0.3, 'triangle', 0.2));
  [523, 659, 784, 1047].forEach((f, i) => tone(f * 2, i * 0.15 + 0.05, 0.25, 'sine', 0.08));
}

function say(text) {
  if (muted || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  u.pitch = 1.2;
  speechSynthesis.speak(u);
}

/* ================= ロボット描画 ================= */
const SVG_NS = 'http://www.w3.org/2000/svg';

function robotSvgMarkup(h, withAll) {
  const body = `hsl(${h}, 70%, 55%)`;
  const dark = `hsl(${h}, 70%, 38%)`;
  const lite = `hsl(${(h + 40) % 360}, 80%, 65%)`;
  const shownCls = withAll ? 'part shown' : 'part';
  const eyeType = Math.floor(Math.random() * 3);
  let eyes;
  if (eyeType === 0) {
    eyes = `<circle cx="82" cy="52" r="9" fill="#fff"/><circle cx="118" cy="52" r="9" fill="#fff"/>
            <circle cx="84" cy="54" r="4.5" fill="#234"/><circle cx="116" cy="54" r="4.5" fill="#234"/>`;
  } else if (eyeType === 1) {
    eyes = `<rect x="72" y="45" width="18" height="14" rx="4" fill="#9ef"/><rect x="110" y="45" width="18" height="14" rx="4" fill="#9ef"/>`;
  } else {
    eyes = `<circle cx="82" cy="52" r="8" fill="#ffd23f"/><circle cx="118" cy="52" r="8" fill="#ffd23f"/>
            <circle cx="82" cy="52" r="3" fill="#234"/><circle cx="118" cy="52" r="3" fill="#234"/>`;
  }
  return `
  <g id="robotBody">
    <g class="${shownCls}" data-part="0">
      <rect x="72" y="196" width="20" height="30" rx="6" fill="${dark}"/>
      <rect x="108" y="196" width="20" height="30" rx="6" fill="${dark}"/>
      <rect x="62" y="222" width="36" height="14" rx="7" fill="${body}"/>
      <rect x="102" y="222" width="36" height="14" rx="7" fill="${body}"/>
    </g>
    <g class="${shownCls}" data-part="1">
      <rect x="58" y="118" width="84" height="84" rx="16" fill="${body}"/>
      <rect x="74" y="136" width="52" height="34" rx="8" fill="${lite}"/>
      <circle cx="88" cy="184" r="7" fill="#ffd23f"/>
      <circle cx="112" cy="184" r="7" fill="#ff5d8f"/>
    </g>
    <g class="${shownCls}" data-part="2">
      <rect x="34" y="126" width="20" height="52" rx="10" fill="${dark}"/>
      <rect x="146" y="126" width="20" height="52" rx="10" fill="${dark}"/>
      <circle cx="44" cy="184" r="12" fill="${lite}"/>
      <circle cx="156" cy="184" r="12" fill="${lite}"/>
    </g>
    <g class="${shownCls}" data-part="3">
      <rect x="88" y="90" width="24" height="30" fill="${dark}"/>
      <rect x="60" y="28" width="80" height="66" rx="18" fill="${body}"/>
      ${eyes}
      <rect x="82" y="72" width="36" height="10" rx="5" fill="#234"/>
      <rect x="86" y="74" width="6" height="6" fill="${lite}"/>
      <rect x="96" y="74" width="6" height="6" fill="${lite}"/>
      <rect x="106" y="74" width="6" height="6" fill="${lite}"/>
    </g>
    <g class="${shownCls}" data-part="4">
      <rect x="97" y="8" width="6" height="22" fill="${dark}"/>
      <circle class="antenna-light" cx="100" cy="8" r="8" fill="#ff5d8f"/>
    </g>
  </g>`;
}

function buildRobot() {
  hue = Math.floor(Math.random() * 360);
  document.getElementById('robotSvg').innerHTML = robotSvgMarkup(hue, false);
}

/* ================= 画面パーツ ================= */
function buildKeyboard() {
  const kb = document.getElementById('kb');
  KB_ROWS.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    row.forEach(ch => {
      const k = document.createElement('div');
      k.className = 'key';
      k.dataset.key = ch;
      k.textContent = ch;
      k.addEventListener('pointerdown', () => handleInput(ch));
      div.appendChild(k);
    });
    kb.appendChild(div);
  });
}

function buildLights() {
  const box = document.getElementById('lights');
  box.innerHTML = '';
  for (let i = 0; i < PARTS_PER_ROBOT; i++) {
    const d = document.createElement('div');
    d.className = 'light';
    box.appendChild(d);
  }
}

function updateLights() {
  document.querySelectorAll('.light').forEach((d, i) => {
    d.classList.toggle('on', i < partsDone);
  });
}

function updateCount() {
  document.getElementById('count').textContent = robotCount;
}

function showPraise() {
  const p = document.createElement('div');
  p.className = 'praise';
  p.textContent = PRAISES[Math.floor(Math.random() * PRAISES.length)];
  document.getElementById('stage').appendChild(p);
  setTimeout(() => p.remove(), 1000);
}

function confetti() {
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random() * 8;
    c.style.width = size + 'px';
    c.style.height = size * (0.6 + Math.random()) + 'px';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = `hsl(${Math.floor(Math.random() * 360)}, 85%, 60%)`;
    document.body.appendChild(c);
    c.animate([
      { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
      { transform: `translateY(${window.innerHeight + 40}px) rotate(${360 + Math.random() * 720}deg)`, opacity: 0.8 }
    ], {
      duration: 1800 + Math.random() * 1500,
      delay: Math.random() * 400,
      easing: 'cubic-bezier(0.2, 0.6, 0.8, 1)'
    }).onfinish = () => c.remove();
  }
}

/* ================= ゲーム進行 ================= */
function nextTarget() {
  let next;
  do { next = CHARS[Math.floor(Math.random() * CHARS.length)]; } while (next === target);
  target = next;
  document.getElementById('targetChar').textContent = target;
  document.querySelectorAll('.key').forEach(k => {
    k.classList.toggle('target', k.dataset.key === target);
  });
  say(CHAR_NAMES[target] || target);
}

function newRobot() {
  partsDone = 0;
  buildRobot();
  updateLights();
  document.getElementById('targetLabel').textContent = 'この キーを おしてね!';
  state = 'playing';
  nextTarget();
}

function flashKey(ch, cls) {
  const k = document.querySelector(`.key[data-key="${ch}"]`);
  if (!k) return;
  k.classList.add(cls);
  setTimeout(() => k.classList.remove(cls), 250);
}

function handleInput(ch) {
  ensureAudio();
  if (state === 'start') { startGame(); return; }
  if (state !== 'playing') return;
  if (!CHARS.includes(ch)) return;

  if (ch === target) {
    flashKey(ch, 'pressed');
    const part = document.querySelector(`#robotSvg .part[data-part="${partsDone}"]`);
    if (part) part.classList.add('shown');
    partsDone++;
    updateLights();
    soundPop();
    showPraise();

    if (partsDone >= PARTS_PER_ROBOT) {
      completeRobot();
    } else {
      nextTarget();
    }
  } else {
    flashKey(ch, 'pressed');
    soundWrong();
    const stage = document.getElementById('stage');
    stage.classList.remove('wobble');
    void stage.offsetWidth;
    stage.classList.add('wobble');
  }
}

function completeRobot() {
  state = 'celebrate';
  robotCount++;
  localStorage.setItem('robotCount', String(robotCount));
  updateCount();
  document.getElementById('targetChar').textContent = '🎉';
  document.getElementById('targetLabel').textContent = 'ロボット かんせい!';
  document.querySelectorAll('.key').forEach(k => k.classList.remove('target'));

  const stage = document.getElementById('stage');
  stage.classList.add('dance');
  soundFanfare();
  confetti();
  say('ロボット かんせい! すごい!');

  setTimeout(() => {
    stage.classList.remove('dance');
    newRobot();
  }, 3200);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  state = 'playing';
  newRobot();
}

/* ================= 入力イベント ================= */
document.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  ensureAudio();
  if (state === 'start') { e.preventDefault(); startGame(); return; }
  const ch = e.key.length === 1 ? e.key.toUpperCase() : null;
  if (ch && CHARS.includes(ch)) {
    e.preventDefault();
    handleInput(ch);
  }
});

document.getElementById('startScreen').addEventListener('pointerdown', () => {
  ensureAudio();
  startGame();
});

document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  localStorage.setItem('robotMuted', muted ? '1' : '0');
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});

/* ================= 初期化 ================= */
function addStars() {
  const screen = document.getElementById('startScreen');
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = Math.random() > 0.5 ? '✦' : '⭐';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.fontSize = 8 + Math.random() * 16 + 'px';
    s.style.animationDelay = Math.random() * 2 + 's';
    screen.appendChild(s);
  }
}

buildKeyboard();
buildLights();
updateCount();
document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
document.getElementById('startRobot').innerHTML = robotSvgMarkup(200, true);
addStars();
</script>
</body>
</html>
